<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扇屋 見積・予算・工程ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#E9EDEB; --panel:#FFFFFF; --ink:#1F2B2E; --sub:#5E6B6D; --line:#CFD6D3; --grid:#DFE4E2;
  --weekend:#DCE3E0; --today:#2F6FB0; --bad:#C4331F; --badbg:rgba(196,51,31,.16); --focus:#2F6FB0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --board:#161C1E; --panel:#20282A; --ink:#E6ECEA; --sub:#9AA7A8; --line:#34403F; --grid:#28312F;
    --weekend:#1D2527; --today:#6FA8E0; --bad:#F06A55; --badbg:rgba(240,106,85,.2); --focus:#6FA8E0;
  }
}
:root[data-theme="dark"]{
  --board:#161C1E; --panel:#20282A; --ink:#E6ECEA; --sub:#9AA7A8; --line:#34403F; --grid:#28312F;
  --weekend:#1D2527; --today:#6FA8E0; --bad:#F06A55; --badbg:rgba(240,106,85,.2); --focus:#6FA8E0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--board);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header{padding:14px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
h1{font-size:20px;margin:0;letter-spacing:.04em}
h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:36px}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tabs{display:flex;gap:4px;padding:0 16px}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--sub)}
.tabs button[aria-selected="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}

#alerts{margin:8px 16px;padding:10px 12px;border-left:4px solid var(--bad);background:var(--panel);border-radius:0 6px 6px 0;font-size:14px}
#alerts.ok{border-color:var(--sub);color:var(--sub)}
#alerts ul{margin:4px 0 0;padding-left:1.2em}

/* board */
.wrap{margin:8px 16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 220px)}
.grid{position:relative;min-width:max-content}
.row{display:flex;border-bottom:1px solid var(--grid)}
.row.sect{background:var(--board);font-size:12px;color:var(--sub);font-weight:700}
.row.sect .lab{background:var(--board)}
.lab{position:sticky;left:0;z-index:3;width:128px;flex:0 0 128px;background:var(--panel);border-right:1px solid var(--line);padding:6px 8px;font-size:14px}
.lab .u{display:block;font-size:11px;color:var(--sub)}
.lab.bad{box-shadow:inset 4px 0 0 var(--bad)}
.track{position:relative}
.hdr{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.hdr .lab{z-index:6;font-size:12px;color:var(--sub);display:flex;align-items:flex-end}
.dcell{position:absolute;top:0;bottom:0;font-size:11px;color:var(--sub);text-align:center;border-left:1px solid var(--grid)}
.dcell.we{background:var(--weekend)}
.dcell .m{display:block;font-weight:700;color:var(--ink);white-space:nowrap;text-align:left;padding-left:2px}
.bg{position:absolute;top:0;bottom:0;pointer-events:none}
.bg.we{background:var(--weekend);opacity:.55}
.bg.today{border-left:2px solid var(--today);opacity:1;background:none;z-index:2}
.bg.bad{background:var(--badbg);border-top:2px solid var(--bad);border-bottom:2px solid var(--bad);z-index:1}
.item{position:absolute;height:24px;border-radius:4px;color:#fff;font-size:12px;line-height:24px;padding:0 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;z-index:2;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.item.pros{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);opacity:.8;outline:1px dashed rgba(0,0,0,.35);outline-offset:-1px}

/* jobs */
.jobs{margin:8px 16px 24px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.job{background:var(--panel);border:1px solid var(--line);border-left:6px solid;border-radius:6px;padding:10px 12px}
.job h3{margin:0 0 2px;font-size:16px}
.job .meta{font-size:13px;color:var(--sub)}
.job table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.job td{padding:3px 4px;border-top:1px solid var(--grid)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);margin-left:6px;vertical-align:2px}
.tag.p{border-style:dashed}
.empty{margin:24px 16px;color:var(--sub)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.db{padding:12px 16px;overflow:auto;max-height:calc(92vh - 130px)}
.df{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.df .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
.f input,.f select,.f textarea,.tt input,.tt select{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--panel);color:var(--ink);min-height:36px}
.ttw{overflow-x:auto;margin:12px 0 6px}
.tt{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
.tt input.q{width:90px}.tt .u,.tt .d{font-size:13px;color:var(--sub);white-space:nowrap}
.tt input[readonly]{background:var(--board);color:var(--sub)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt tfoot td{border-top:2px solid var(--line);font-weight:700}
.tt tbody td{border-top:1px solid var(--grid)}
.warn{color:var(--bad)}
.pv{font-size:12px;border-collapse:collapse}.pv td{border:1px solid var(--grid);padding:2px 4px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}.pv tr.hd td{background:var(--board);font-weight:700}
.mst.wide{max-width:none}
.mst{margin:8px 16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:820px}
.mst .tt{min-width:520px}.mst input.mr{width:110px}.mst input.mu{width:70px}
.tt th{text-align:left;font-size:12px;color:var(--sub);font-weight:400;padding:4px}
.tt td{padding:3px 4px}
.tt input[type=text]{width:100%}
.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;min-width:32px;min-height:32px}
.note{font-size:12px;color:var(--sub);margin:4px 0}
.help{margin:0 0 8px;border:1px solid #d9dee7;border-radius:8px;background:#fff;font-size:12px}.help summary{cursor:pointer;padding:6px 10px;font-weight:600;color:#1f3864;list-style:none}.help summary::before{content:'？ ';display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:#1f3864;color:#fff;font-size:11px;margin-right:4px}.help .hb{padding:0 12px 8px;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px}.help .hb b{font-weight:600;white-space:nowrap}.help .hb p{margin:0 0 6px;grid-column:1/-1;color:var(--sub)}
[title]{cursor:help}button[title]{cursor:pointer}
textarea.code{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>見積・予算・工程ボード<small>扇屋｜設計書→見積→実行予算→工程→配置</small></h1>
  <div class="bar">
    <label class="f" id="gJobWrap" style="min-width:280px">案件<select id="gJob"></select></label>
    <button class="btn primary" id="add" title="手入力で新しい案件を作る">案件を追加</button>
    <span id="boardCtl" style="display:contents">
    <button class="btn" id="prev" aria-label="前へ">◀</button>
    <button class="btn" id="today">今日</button>
    <button class="btn" id="next" aria-label="次へ">▶</button>
    <div class="seg" role="group" aria-label="表示幅">
      <button id="zDay" aria-pressed="true">8週</button><button id="zWeek" aria-pressed="false">半年</button>
    </div>
    <label class="chk"><input type="checkbox" id="pros" checked>見込み案件も含める</label>
    <button class="btn" id="opt" title="全案件の班と日程を納期順に自動で決め直す（固定した工種は動かさない）">配置を最適化</button>
    </span>
    <button class="btn" id="data" title="監督・班・休日の設定と、データの書き出し／読み込み／全消去">データ・設定</button>
  </div>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="tDesign" aria-selected="true">① 設計書</button>
  <button role="tab" id="tMst" aria-selected="false">② 歩掛り</button>
  <button role="tab" id="tEst" aria-selected="false">③ 見積</button>
  <button role="tab" id="tBud" aria-selected="false">④ 実行予算</button>
  <button role="tab" id="tBoard" aria-selected="false">⑤ 計画工程</button>
  <button role="tab" id="tAct" aria-selected="false">⑥ 実施工程</button>
  <span style="flex:1"></span>
  <button role="tab" id="tJobs" aria-selected="false">案件一覧</button>
  <button role="tab" id="tRule" aria-selected="false">配置ルール</button>
</div>
<div id="alerts"></div>
<main id="main"></main>

<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<datalist id="kinds"></datalist>

<script>
(function(){
const DAY=86400000, KEY='ohgiya-koutei-v3';
const COLORS=['#3F7D4E','#2F6FB0','#A0672A','#7A4E98','#1F7F86','#B0453A','#5B6B2F','#546072'];
const toN=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/DAY);
const toS=n=>new Date(n*DAY).toISOString().slice(0,10);
const today=()=>{const d=new Date();return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)};
const dow=n=>new Date(n*DAY).getUTCDay();
const md=n=>{const d=new Date(n*DAY);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const monday=n=>n-((dow(n)+6)%7);

// 歩掛り（1班1日あたりの施工量）。初期値は R5 土木工事標準積算基準書 第I編第14章②「市場単価の作業日当り標準作業量」。
// 材料単価は48期完成台帳の実勢（台帳_品目単価）、見積単価は48期出来高DBの売単価中央値（材工共・税抜）。いずれも実績で上書きしていく前提。
function sampleMaster(){
  // [工種, 単位, 1班1日あたり, 材料単価(円/単位), 見積単価(円/単位), 出所]  ※1班＝4人換算
  const R5='R7基準書 Ⅰ-14-⑤', R4='R7基準書 Ⅰ-14-④', LED='台帳', DK='出来高DB', TMP='仮置き';
  const M=[
   ['準備工','日',1,0,0,TMP],
   ['伐採工','m2',768,0,0,R4+'-76 伐木(人力・中)'],
   ['法面整形工','m2',140,0,1300,R4+'-19 切土・レキ質土'],
   ['吹付法面とりこわし工','m2',54,0,0,R4+'-20 人力'],
   ['ラス張工','m2',140,380,650,R5+'-14 表10.2'],
   ['モルタル吹付工 t=5〜7cm','m2',120,1500,4500,R5+'-13 表9.1'],['モルタル吹付工 t=8〜10cm','m2',100,2300,11000,R5+'-13 表9.1'],
   ['コンクリート吹付工 t=10cm','m2',100,2600,8280,R5+'-13 表9.2'],['コンクリート吹付工 t=15cm','m2',60,3900,0,R5+'-13 表9.2'],
   ['植生基材吹付工 t=3〜5cm','m2',140,1400,5600,R5+'-13 表9.3'],['植生基材吹付工 t=6〜8cm','m2',110,2000,6500,R5+'-13 表9.3'],['植生基材吹付工 t=10cm','m2',100,2800,0,R5+'-13 表9.3'],
   ['客土吹付工','m2',400,500,1500,R5+'-13 表9.3'],['種子散布工','m2',1100,80,150,R5+'-13 表9.3'],
   ['植生マット工','m2',200,1500,2800,R5+'-13 表9.4'],['植生シート工','m2',250,700,1290,R5+'-13 表9.4'],['張芝工','m2',300,800,1200,R5+'-13 表9.4'],
   ['繊維ネット工','m2',250,600,0,R5+'-13 表9.5'],['多機能フィルター','m2',250,1800,2350,DK+'（日当りは繊維ネット準用）'],
   ['吹付法枠工 F150','m',98,1800,0,R5+'-14 表10.1'],['吹付法枠工 F200','m',77,2500,16000,R5+'-14 表10.1'],['吹付法枠工 F300','m',51,3800,11000,R5+'-14 表10.1'],['吹付法枠工 F400','m',30,5500,10200,R5+'-14 表10.1'],['吹付法枠工 F500','m',26,7500,0,R5+'-14 表10.1'],
   ['簡易吹付法枠工','m2',19,7600,17000,'ATLUS蘇原飛鳥町 代価表（治山林道必携）10.06人工/47㎡'],
   ['鉄筋挿入工 L≦2m','本',14,7500,30000,R5+'-29 表21.1 条件Ⅰ'],['鉄筋挿入工 L=2〜5m','本',7,9000,48000,R5+'-29 表21.1 条件Ⅰ'],
   ['鉄筋挿入工 L≦2m（条件Ⅱ 狭隘）','本',8,7500,0,R5+'-29 表21.1 条件Ⅱ'],['鉄筋挿入工 L=2〜5m（条件Ⅱ 狭隘）','本',4,9000,0,R5+'-29 表21.1 条件Ⅱ'],
   ['グラウンドアンカー工','本',3,80000,220000,R4+'-36 鋼材組立〜頭部処理 3.1本/日'],
   ['落石防護網工（金網・ロープ設置）','m2',130,2500,6000,R5+'-11 表8.1 線径2.6mm'],['落石防護網 アンカー設置（岩盤用）','箇所',15,9000,0,R5+'-11 表8.2'],
   ['落石防護柵工','m',15,40000,80000,R5+'-10 表7.1 柵高2.0m'],
   ['ワイヤネット工（ロープ伏工）','m2',7,20200,41800,'扇屋49-014 代価表 58.1人/100㎡（基準書は市場単価適用外）'],
   ['DKドレーンパイプ工 L=2.0m','本',7.5,13600,65000,'扇屋49-014 代価表 0.53人/本（据付撤去8人工/回は別途）'],
   ['石積工（練積）','m2',19,15000,0,R4+'-23 積工・練石'],['コンクリートブロック積工','m2',13,12000,0,R4+'-21 間知ブロック積'],
   ['足場工','空m3',40,0,6528,R5+'-29 表21.1 仮設足場'],
   ['地盤改良工（表層）','m2',170,1500,3000,R4+'-18 安定処理(バックホウ)'],['地盤改良工（柱状）','本',20,8000,15000,TMP],
   ['擁壁工','m3',6.3,20000,60000,R4+'-24 重力式2〜5m'],['護岸工','m2',13,5000,12000,R4+'-21 間知ブロック積 準用'],
   ['外構工','日',1,30000,80000,TMP],['舗装工','m2',300,2000,4000,TMP+'（道路編 3-3 参照）'],['片付け','日',1,0,0,TMP]];
  return M.map(([kind,unit,rate,matUnit,price,src])=>({kind,unit,rate,men:stdMen(kind),mach:stdMach(kind),crewDay:120000,matUnit,price,src,actuals:[]}));
}
// 標準人数（基準書の日当り施工量が想定する編成に近い値。仮置き：扇屋の実態で直す）
function stdMen(k){
  if(/準備工|片付け/.test(k)) return 2;
  if(/法面整形|伐採|とりこわし/.test(k)) return 2;
  if(/ラス張|植生マット|植生シート|張芝|繊維ネット|多機能|種子散布|客土/.test(k)) return 3;
  if(/鉄筋挿入|グラウンドアンカー|DKドレーン/.test(k)) return 3;
  if(/石積|ブロック積|擁壁|護岸|外構/.test(k)) return 3;
  return 4; // 吹付・法枠・ワイヤネット・落石・足場・地盤改良・舗装
}
// 機械・車両の日額（仮置き）：吹付機・コンプレッサー・削孔機・トラック等
function stdMach(k){
  if(/鉄筋挿入|グラウンドアンカー|DKドレーン/.test(k)) return 30000;
  if(/吹付|法枠/.test(k)) return 15000;
  if(/地盤改良|舗装/.test(k)) return 40000;
  return 5000;
}
// 班×工種ランク（松竹梅）と現場難易度（ABC）の相性表。歩掛係数kは日進量に掛ける（0.8なら2割遅い）
function sampleRules(){
  return {
    '松':{A:{use:'推奨',k:1.0},B:{use:'可',k:1.0},C:{use:'可',k:1.0,waste:1}},
    '竹':{A:{use:'可',k:0.8},B:{use:'推奨',k:1.0},C:{use:'可',k:1.0}},
    '梅':{A:{use:'禁止',k:0.6},B:{use:'可',k:0.8},C:{use:'推奨',k:1.0}}
  };
}
const RANKS=['松','竹','梅'], GRADES=['A','B','C'];
function sample(){
  const t=today(), d=o=>toS(t+o);
  const T=(k,q,c,a)=>({id:uid(),kind:k,qty:q,start:a===undefined?'':d(a),end:'',crew:c});
  const sups=['監督A','監督B','監督C','監督D','監督E'];
  const crewRank={}; sups.forEach((c,i)=>{crewRank[c]={}; ['吹付法枠工 F300','鉄筋挿入工 L=2〜5m','植生基材吹付工 t=3〜5cm','モルタル吹付工 t=5〜7cm'].forEach(k=>crewRank[c][k]=['松','松','竹','竹','梅'][i]);});
  return {
    sups, supRank:{}, crews:sups.slice(), crewRank, rules:sampleRules(), staff:20, manDay:28000,
    weights:{due:10,early:2,dist:2,waste:3,level:1},
    est:{keihi:0.10,houtei:0.05,kanri:0.30,rieki:0.08,tax:0.10},
    supCap:2, crewCap:99, holiday:'sat-sun', bugakari:sampleMaster(),
    jobs:[]
  };
}
function sampleJobs(){
  const t=today(), d=o=>toS(t+o);
  const CM={'施工1班':'監督A','施工2班':'監督B','施工3班':'監督C','施工4班':'監督D','施工5班':'監督E'};
  const T=(k,q,c,a)=>({id:uid(),kind:k,qty:q,start:a===undefined?'':d(a),end:'',crew:CM[c]||c});

// ---------- 暦と歩掛り ----------
const isHol=n=>{const w=dow(n);return S.holiday==='sat-sun'?(w===0||w===6):S.holiday==='sun'?w===0:false};
const nextWork=n=>{let k=0;while(isHol(n)&&k++<14)n++;return n};
function endOf(s,days){let n=nextWork(s),c=1;while(c<days){n++;if(!isHol(n))c++}return n}
function wdays(s,e){let c=0;for(let n=s;n<=e;n++)if(!isHol(n))c++;return c}
const bk=k=>S.bugakari.find(b=>b.kind===k);
// 採用歩掛＝実績点の中央値（実績がなければマスタ値）。条件タグが合う実績が2点以上あればそれだけを使う
function stats(b,tags){
  if(!b) return null;
  const pts=(b.actuals||[]).filter(p=>p.qty>0&&p.days>0);
  let use=pts, by='全実績';
  if(tags&&tags.length){const m=pts.filter(p=>(p.tags||[]).some(x=>tags.includes(x))); if(m.length>=2){use=m;by='タグ一致'}}
  if(!use.length) return {rate:b.rate,lo:b.rate,hi:b.rate,n:0,by:'マスタ値'};
  const r=use.map(p=>p.qty/p.days).sort((a,c)=>a-c);
  const q=f=>{const i=(r.length-1)*f,a=Math.floor(i);return r[a]+(r[Math.min(a+1,r.length-1)]-r[a])*(i-a)};
  return {rate:q(.5),lo:r.length>=4?q(.25):r[0],hi:r.length>=4?q(.75):r[r.length-1],n:r.length,by};
}
// 班×工種のランク（未設定は竹）、監督ランク、相性ルール
const crewRank=(c,k)=>(S.crewRank?.[c]?.[k])||'竹';
const supRank=p=>(S.supRank?.[p])||'竹';
const rule=(rank,diff)=>(S.rules?.[rank]?.[diff])||{use:'可',k:1};
// 歩掛係数：班が決まっていれば その班のランク×現場難易度 の係数。未定なら1
// 単位が「日」の工種（準備工・片付け・外構工など日数指定のもの）には係数を掛けない
const kOf=(t,j)=>{const b=bk(t.kind); if(!b||b.unit==='日') return 1; return t.crew&&j&&j.diff?(rule(crewRank(t.crew,t.kind),j.diff).k||1):1};
const menOf=t=>{const b=bk(t.kind); const m=parseFloat(t.men); return m>0?m:(b?.men||4)};
const menRatio=t=>{const b=bk(t.kind); if(!b||b.unit==='日') return 1; return menOf(t)/(b.men||4)};
function need(t,tags,j){const st=stats(bk(t.kind),tags),q=parseFloat(t.qty);if(!(st&&st.rate>0&&q>0))return null;return Math.max(1,Math.ceil(q/(st.rate*kOf(t,j)*menRatio(t))))}
function applyTask(t,tags,j){const d=need(t,tags,j);if(d&&t.start){const s=nextWork(toN(t.start));t.start=toS(s);t.end=toS(endOf(s,d))}}
function applyJob(j){j.tasks.forEach(t=>applyTask(t,j.tags,j))}
function applyAll(){S.jobs.forEach(applyJob)}
// 上から順に、前の工種の翌稼働日から始める
function packJob(j){let prev=null;j.tasks.forEach(t=>{
  if(prev!==null){const len=t.start&&t.end?Math.max(1,wdays(toN(t.start),toN(t.end))):1;const s=nextWork(prev+1);
    t.start=toS(s);t.end=toS(endOf(s,need(t,j.tags,j)||len));}
  else applyTask(t,j.tags,j);
  if(t.end) prev=toN(t.end);})}

  if(!S.rules) S.rules=sampleRules(); if(!S.crewRank) S.crewRank={}; if(!S.supRank) S.supRank={};
  if(!S.weights) S.weights={due:10,early:2,dist:2,waste:3,level:1}; if(S.weights.early===undefined) S.weights.early=2;
  if(!S.est) S.est={keihi:0.10,houtei:0.05,kanri:0.30,rieki:0.08,tax:0.10};
  if(!S.crewSize) S.crewSize=4;
  // v3.6：施工班を廃止し「監督＝班」。監督が現場ごとに人数を決める体制に合わせる
  if(!S.staffModel){
    const old=S.crews||[]; S.crews=S.sups.slice();
    const map={}; old.forEach((c,i)=>{map[c]=S.sups[i]||''});
    S.jobs.forEach(j=>j.tasks.forEach(t=>{if(t.crew&&!S.sups.includes(t.crew)) t.crew=map[t.crew]||j.sup||''; if(!t.crew&&j.sup) t.crew=j.sup;}));
    const cr={}; S.sups.forEach((p,i)=>{cr[p]=Object.assign({},S.crewRank[old[i]]||{}); }); S.crewRank=cr; S.supRank={};
    S.staffModel=true;
  }
  S.crews=S.sups; if(!S.staff) S.staff=20; if(!S.manDay) S.manDay=28000; if(!S.supCap) S.supCap=2; S.crewCap=99;
  const d2=sampleMaster();

  S.jobs.forEach(j=>j.tasks.forEach(t=>{if(t.men===undefined) t.men='';}));

function span(j){
  const v=j.tasks.filter(t=>t.start&&t.end); if(!v.length) return null;
  return [Math.min(...v.map(t=>toN(t.start))),Math.max(...v.map(t=>toN(t.end)))];
}

function buildRows(jobs){
  const rows=[];
  S.sups.forEach(p=>rows.push({kind:'sup',name:p,cap:S.supCap,items:[]}));
  const none={kind:'sup',name:'監督未定',cap:Infinity,items:[],none:true};
  const staff={kind:'staff',name:`人員合計（${S.staff}人）`,cap:S.staff,items:[],men:{}};
  jobs.forEach(j=>{
    j.tasks.forEach(t=>{ if(!t.start||!t.end) return;
      const r=rows.find(r=>r.kind==='sup'&&r.name===(t.crew||j.sup))||none;
      const m=menOf(t), s0=toN(t.start), e0=toN(t.end);
      r.items.push({job:j,task:t,s:s0,e:e0,men:m,label:`${t.kind}｜${j.name}（${m}人）`});
      for(let n=s0;n<=e0;n++){ if(isHol(n)) continue; staff.men[n]=(staff.men[n]||0)+m; }
    });
  });
  if(none.items.length) rows.push(none);
  rows.forEach(r=>{
    // 1日あたりの現場数（監督）：同じ案件の工種は1現場と数える
    const cnt={}, byDay={};
    r.items.forEach(it=>{for(let n=it.s;n<=it.e;n++){(byDay[n]||(byDay[n]=new Set())).add(it.job.id)}});
    Object.keys(byDay).forEach(n=>cnt[n]=byDay[n].size);
    r.cnt=cnt; r.over=[];
    const days=Object.keys(cnt).map(Number).sort((a,b)=>a-b);
    let cur=null;
    days.forEach(n=>{ if(cnt[n]>r.cap){ if(cur&&cur.b===n-1){cur.b=n;cur.max=Math.max(cur.max,cnt[n])} else {cur={a:n,b:n,max:cnt[n]};r.over.push(cur)} } });
    const lanes=[]; r.items.sort((a,b)=>a.s-b.s||b.e-a.e).forEach(it=>{
      let k=lanes.findIndex(e=>e<it.s); if(k<0){k=lanes.length;lanes.push(it.e)} else lanes[k]=it.e; it.lane=k;
    });
    r.lanes=Math.max(1,lanes.length);
  });
  // 人員合計の超過
  staff.cnt=staff.men; staff.over=[]; staff.lanes=1;
  {const days=Object.keys(staff.men).map(Number).sort((a,b)=>a-b); let cur=null;
   days.forEach(n=>{ if(staff.men[n]>staff.cap){ if(cur&&cur.b===n-1){cur.b=n;cur.max=Math.max(cur.max,staff.men[n])} else {cur={a:n,b:n,max:staff.men[n]};staff.over.push(cur)} } });}
  rows.unshift(staff);
  return rows;
}

function renderAlerts(rows){ $('alerts').style.display='';

V.bud=null;
function budgetRows(j){
  return j.tasks.map(t=>{
    const b=bk(t.kind), st=stats(b,j.tags), q=parseFloat(t.qty)||0;
    const planDays=t.start&&t.end?wdays(toN(t.start),toN(t.end)):0;
    const days=need(t,j.tags,j)||planDays;
    const dHi=st&&st.lo>0&&q?Math.ceil(q/st.lo):days, dLo=st&&st.hi>0&&q?Math.ceil(q/st.hi):days;
    const men=menOf(t), md0=S.manDay||28000, perDay=men*md0+(b?.mach||0), mat=b?q*b.matUnit:0;
    const src=t.src||null, cs=men, kanDaily=src&&src.ninku>0&&q?q/(src.ninku/cs):(src?.daily||0), kanDays=src?(src.days||(kanDaily>0&&q?Math.ceil(q/kanDaily):null)):null;
    return {t,b,st,q,days,dLo,dHi,men,manDays:days*men,labor:days*men*md0,mach:days*(b?.mach||0),laborLo:dLo*perDay,laborHi:dHi*perDay,mat,total:days*perDay+mat,totalLo:dLo*perDay+mat,totalHi:dHi*perDay+mat,src,kanDays,kanDaily,kanPrice:src&&src.amount&&q?src.amount/q:null};
  });
}

// ---------- ATLUS Excel 取込 ----------
const FIELDS=[['name','名称',/名称|工種|種別|細別|規格|品名/],['code','コード',/コード|code/i],['qty','数量',/数量/],['unit','単位',/単位/],
  ['amount','金額',/金額/],['daily','日進量',/日進|日当/],['days','施工日数',/日数/]];
let IMP=null;
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const num=v=>{if(typeof v==='number')return v;const x=parseFloat(String(v??'').replace(/[,，\s円]/g,''));return isFinite(x)?x:NaN};
function guess(aoa){
  let best=0,bs=-1;
  aoa.slice(0,40).forEach((r,i)=>{const s=FIELDS.filter(([,,re])=>r.some(c=>re.test(String(c??'')))).length;if(s>bs){bs=s;best=i}});
  const hdr=aoa[best]||[], cols={};
  FIELDS.forEach(([k,,re])=>{const i=hdr.findIndex(c=>re.test(String(c??'')));cols[k]=i});
  return {hdr:best,cols};
}
function impRows(){
  const {aoa,hdr,cols}=IMP, out=[];
  for(let i=hdr+1;i<aoa.length;i++){const r=aoa[i]; const g=k=>cols[k]>=0?r[cols[k]]:'';
    const name=String(g('name')??'').trim(), q=num(g('qty'));
    if(!name||!(q>0)) continue;
    out.push({row:i+1,name,code:String(g('code')??'').trim(),qty:q,unit:String(g('unit')??'').trim(),amount:num(g('amount'))||0,daily:num(g('daily'))||0,days:num(g('days'))||0});}
  return out;
}
const keyOf=r=>r.code||r.name;
// 名称から自社工種を推定（ATLUSの行名 → マスタ）。一致しなければ ''。
const KW=[[/簡易.*法枠|簡易法枠/,'簡易吹付法枠工'],[/法枠.*(F|ﾌ)?\s*400|400.*法枠/,'吹付法枠工 F400'],[/法枠.*(F|ﾌ)?\s*200|200.*法枠|法枠.*150/,'吹付法枠工 F200'],[/吹付法枠|法枠工/,'吹付法枠工 F300'],
  [/植生基材.*(6|7|8)\s*cm|植生基材.*t\s*=\s*(6|7|8)/,'植生基材吹付工 t=6〜8cm'],[/植生基材|厚層基材/,'植生基材吹付工 t=3〜5cm'],[/モルタル吹付.*(8|9|10)\s*cm|ﾓﾙﾀﾙ吹付.*(8|9|10)/,'モルタル吹付工 t=8〜10cm'],[/モルタル吹付|ﾓﾙﾀﾙ吹付/,'モルタル吹付工 t=5〜7cm'],
  [/コンクリート吹付|ｺﾝｸﾘｰﾄ吹付/,'コンクリート吹付工 t=10cm'],[/客土吹付/,'客土吹付工'],[/種子散布/,'種子散布工'],[/植生マット|植生ﾏｯﾄ/,'植生マット工'],[/植生シート|植生ｼｰﾄ/,'植生シート工'],[/張芝/,'張芝工'],[/ラス|ﾗｽ|金網張/,'ラス張工'],
  [/鉄筋挿入.*(L|ﾙ)?\s*=?\s*[1]\.?\d*\s*m|鉄筋挿入.*2\.0\s*m/,'鉄筋挿入工 L≦2m'],[/鉄筋挿入|ロックボルト|ﾛｯｷﾞﾎﾞﾙﾄ/,'鉄筋挿入工 L=2〜5m'],[/グラウンドアンカー|ｸﾞﾞﾗｳﾝﾄﾞｱﾝｶｰ/,'グラウンドアンカー工'],
  [/ワイヤネット|ﾜｲﾔﾈｯﾄ|ロープ伏/,'ワイヤネット工（ロープ伏工）'],[/DKドレーン|ＤＫドレーン|ドレーンパイプ/,'DKドレーンパイプ工 L=2.0m'],[/石積/,'石積工（練積）'],[/落石防護網|落石防止網|ロックネット|ﾛｯｸﾈｯﾄ|防護網/,'落石防護網工（金網・ロープ設置）'],[/落石防護柵|防護柵/,'落石防護柵工'],[/足場/,'足場工'],[/法面整形|整形工/,'法面整形工'],[/伐採|除根/,'伐採工'],[/^準備工/,'準備工'],[/^後片付|^片付/,'片付け'],[/^舗装/,'舗装工'],[/^擁壁/,'擁壁工'],[/^護岸/,'護岸工'],[/^外構/,'外構工']];
function guessKind(name){const n=String(name||'').replace(/^[\s　]+/,''); if(/^(材料費|施工費|労務費|運搬|資材運賃|諸雑費|経費)/.test(n)) return ''; for(const [re,k] of KW){if(re.test(n)&&bk(k))return k}return ''}
// 代価表を再帰的に解いて「基準数量あたりの人工」を出す（人件費＝単位が「人」の行。下位の単価表を参照する行はその単価表を解く）
function ninkuOf(A,blk,depth=0){
  if(!blk||depth>6) return 0;
  const bl=A.daika.filter(b=>b.no===blk.no); // 同じ号が複数に割れていることがある
  let n=0; bl.forEach(b=>b.items.forEach(x=>{
    if(x.unit==='人'){n+=x.qty;return}
    const sub=A.daika.find(c=>c!==b&&c.name&&x.name&&x.name.replace(/\s.*$/,'')===c.name.replace(/\s.*$/,'')&&c.base&&c.no!==blk.no);
    if(sub&&sub.base.qty>0) n+=ninkuOf(A,sub,depth+1)*x.qty/sub.base.qty;}));
  return n;
}
function ninkuForRows(A,rows){ // 取込行（本工事費表）→ 人工
  if(!A) return 0; let n=0;
  rows.forEach(r=>{const head=String(r.name||'').replace(/\s.*$/,''); const blk=A.daika.find(b=>b.base&&b.name&&b.name.replace(/\s.*$/,'')===head);
    if(blk&&blk.base.qty>0) n+=ninkuOf(A,blk)*r.qty/blk.base.qty;});
  return n;
}

// ---------- ATLUS NEXT 印刷様式（表紙／本工事費表／代価表／数量調書）の読み取り ----------
// 「本工事費表」から工種行（単位が式でない行）を、「数量調書（労材機集計表）」から材料・人件費・機械損料・機械賃料・諸雑費を拾う。
// セル位置は様式によって動くので、列番号は決め打ちせず「数量(数値)・単位(文字)・金額(数値)」の並びで行を見つける。
const isNum=v=>typeof v==='number'&&isFinite(v);
const txt=v=>(v==null?'':String(v)).replace(/　/g,' ').trim();
function valueRow(r){ // 数量・単位・(単価)・金額 の並びを探す（間の空セルは無視）
  const c=r.filter(v=>v!==''&&v!=null);
  for(let i=0;i<c.length-2;i++){
    if(!isNum(c[i])) continue;
    const u=txt(c[i+1]); if(!u||isNum(c[i+1])||u.length>6) continue;
    if(!isNum(c[i+2])) continue;
    const nums=c.slice(i+2).filter(isNum);
    const amt=nums[nums.length-1], price=nums.length>=2?nums[0]:null;
    const note=c.slice(i+2).filter(v=>typeof v==='string').map(txt).join(' ');
    const lead=c.slice(0,i).map(txt).filter(v=>v&&!/^\d+$/.test(v));
    return {qty:c[i],unit:u,price,amt,note,lead};
  }
  for(let i=1;i<c.length-1;i++){ // 単位(文字)・数量・単価・金額
    if(!isNum(c[i])||isNum(c[i-1])) continue; const u=txt(c[i-1]); if(!u||u.length>6||!/^(m|㎡|m2|m3|㎥|本|個|式|箇所|枚|袋|kg|t|ｔ|日|回|人|時間|組|台|L|ℓ|ｍ|ha|巻|缶|か所)$/i.test(u)) continue;
    if(!isNum(c[i+1])) continue;
    const nums=c.slice(i+1).filter(isNum); const amt=nums[nums.length-1], price=nums.length>=2?nums[0]:null;
    const lead=c.slice(0,i-1).map(txt).filter(v=>v&&!/^\d+$/.test(v));
    return {qty:c[i],unit:u,price,amt,note:c.slice(i+1).filter(v=>typeof v==='string').map(txt).join(' '),lead};
  }
  return null;
}
function textsOf(r){return r.map(txt).filter(v=>v&&!/^(名\s*称|数\s*量|単\s*位|単\s*価|金\s*額|摘\s*要|備\s*考)/.test(v))}
function isAtlasPrint(wb){return wb.SheetNames.some(n=>/本工事費/.test(n))&&wb.SheetNames.some(n=>/数量調書|労材機/.test(n))}
function parseAtlasPrint(wb){
  const A=n=>{const nm=wb.SheetNames.find(x=>new RegExp(n).test(x)); return nm?XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''}):null};
  const out={meta:{},items:[],lmk:{材料費:[],人件費:[],機械損料:[],機械賃料:[],諸雑費:[]},totals:{},daika:[]};
  // 表紙
  const cov=A('表紙'); if(cov){cov.forEach(r=>{const t=textsOf(r);for(let i=0;i<t.length-1;i++){
    if(/^工\s*事\s*名/.test(t[i])&&!out.meta.name) out.meta.name=t[i+1];
    if(/^施工箇所|工事場所/.test(t[i])&&!out.meta.place) out.meta.place=t[i+1];
    if(/^(管理|工事|案件)\s*番号/.test(t[i])&&!out.meta.no&&/^\d{2}-\d{3}$/.test(t[i+1]||'')) out.meta.no=t[i+1];}});}
  // 本工事費表
  out.keihi=[]; out.kouji=null;
  const hon=A('本工事費'); if(hon){let pend=[],grp='',started=false,stop=false,kp=[],done=false; const isGrp=x=>/工$|工（|工\s|工\u3000/.test(x);
    hon.forEach((r,ri)=>{const raw=r.map(txt).join(' ');
      if(/名\s*称/.test(raw)&&/数\s*量/.test(raw)){started=true;pend=[];grp='';return}
      if(!started) return;
      if(stop){ // 経費ブロック：直接工事費計の後ろ（現場管理費・諸経費・端数調整・工事金額）
        if(done) return;
        const t=textsOf(r).filter(x=>!/株式会社|^\d+$|^[％%]$/.test(x)), nums=r.filter(isNum);
        if(t.some(x=>/消費税|^合\s*計/.test(x))){done=true;return}
        if(t.length&&!nums.length){kp=t;return}
        if(!nums.length) return;
        const head=(kp[0]||t[0]||'').trim(), sub=[...kp.slice(1),...(kp.length?t:t.slice(1))].filter(x=>!/の$/.test(x)); kp=[];
        if(!head||/^(直接工事費|うち|内訳|式$)/.test(head)) return;
        const amt=nums[nums.length-1];
        if(/工事金額/.test(head)){out.kouji=amt;return}
        const pi=r.findIndex(c=>/^[％%]$/.test(String(c).trim())); const rate=pi>0&&isNum(r[pi-1])?r[pi-1]:null;
        const base=t.find(x=>/の$/.test(x))||'';
        out.keihi.push({name:head+(sub.length?'（'+sub.join(' ')+'）':''),rate,base:base.replace(/の$/,''),amt});
        return}
      const v=valueRow(r);
      if(!v){const t=textsOf(r); if(t.some(x=>/直接工事費\s*計|直接工事費計/.test(x))){stop=true;return}
        t.filter(x=>!/本工事費|株式会社|^\d+$|^内訳|^うち/.test(x)).forEach(x=>{if(isGrp(x)){grp=x;pend=[]}else pend.push(x)}); return}
      if(/[％%]/.test(v.unit)) return;
      const lead=(v.lead||[]).filter(x=>!/^(内訳|うち)/.test(x));
      // 名称＝（工種見出し）＋（直前の文字行）＋（同じ行の文字）。ATLUS様式は見出し行と値行が分かれ、扇屋書式は同じ行に名称がある。
      const parts=[...pend,...lead]; const name=(grp&&!(parts.length&&isGrp(parts[0]))?[grp,...parts]:parts).join(' ').trim(); pend=[];
      if(!name) return;
      if(v.unit==='式'&&!v.price) return; // 階層・計の行
      if(/直接工事費|工事費計|合計/.test(name)) return;
      out.items.push({row:ri+1,name,qty:v.qty,unit:v.unit,price:v.price,amount:v.amt,ref:v.note});});}
  // 数量調書（労材機集計表）
  const su=A('数量調書|労材機'); if(su){let cur=[],pend=[];
    su.forEach(r=>{const t=textsOf(r);
      const tot=t.find(x=>/(材料費|人件費|労務費|機械損料|機械賃料|諸雑費)\s*合計/.test(x));
      if(tot){const key=tot.replace(/\s*合計.*/,'').replace('労務費','人件費'); out.lmk[key]=cur; const n0=r.filter(isNum).pop(); out.totals[key]=isNum(n0)&&n0>100?n0:null; cur=[]; pend=[]; out._lastKey=out.totals[key]==null?key:null; return}
      if(out._lastKey&&!cur.length&&!pend.length){const n=r.find(isNum); if(isNum(n)&&!valueRow(r)){out.totals[out._lastKey]=n; out._lastKey=null; return}}
      const v=valueRow(r);
      if(!v){const tt=t.filter(x=>!/集\s*計\s*表|株式会社|^\d+$/.test(x)); if(tt.length) pend=tt; return}
      const L=v.lead||[]; cur.push({name:pend[0]||L[0]||'',spec:(pend.length?pend.slice(1):L.slice(1)).join(' '),qty:v.qty,unit:v.unit,price:v.price,amt:v.amt,note:v.note}); pend=[];});}
  delete out._lastKey;
  // 設計数量（工区別数量表）：区分・名称・規格・単位・数量
  out.design=[]; if(su){let on=false;
    su.forEach(r=>{const t=textsOf(r);
      if(t.some(x=>/設計数量|工区別数量表/.test(x))){on=true;return}
      if(!on) return;
      if(t.some(x=>/集計リスト|合計$/.test(x))){on=false;return}
      const c=r.filter(v=>v!==''&&v!=null); const i=c.findIndex(isNum); if(i<1) return;
      const unit=txt(c[i-1]); if(!unit||unit.length>6) return;
      const lead=c.slice(0,i-1).map(txt).filter(Boolean); if(!lead.length) return;
      out.design.push({group:lead[0],name:lead.slice(1).join(' '),unit,qty:c[i],note:c.slice(i+1).map(txt).join(' ')});});}
  Object.keys(out.lmk).forEach(k=>{if(out.totals[k]==null) out.totals[k]=out.lmk[k].reduce((a,x)=>a+(x.amt||0),0)});
  // 代価表：ブロック単位（名称・基準数量・内訳）
  const dk=A('代価表'); if(dk){let blk=null,pend=[];
    dk.forEach(r=>{const t=textsOf(r); const no=t.find(x=>/\d+号\s*単価表/.test(x));
      const v=valueRow(r);
      if(no&&!v&&t.length>=2&&!blk?.open){ // ブロック見出し
        if(blk) out.daika.push(blk); blk={no,name:t.filter(x=>x!==no).join(' '),base:null,items:[],open:true}; pend=[]; return}
      if(!blk) return;
      if(blk.open&&!blk.base){const c=r.filter(v=>v!==''&&v!=null); const i=c.findIndex(isNum); if(i>=0&&txt(c[i+1])){blk.base={qty:c[i],unit:txt(c[i+1]),spec:t.filter(x=>!isNum(x)).join(' ')}; blk.open=false; return}}
      if(t.some(x=>/^合計/.test(x))){const n=r.filter(isNum).pop(); blk.total=n; return}
      if(t.some(x=>/当り$/.test(x))){const n=r.filter(isNum).pop(); blk.unitPrice=n; return}
      if(!v){const tt=t.filter(x=>!/株式会社|^\d+$|単価表$|運転単価表$/.test(x)); if(tt.length) pend.push(...tt); return}
      blk.items.push({name:(pend.length?pend:(v.lead||[])).join(' '),qty:v.qty,unit:v.unit,price:v.price,amt:v.amt,note:v.note}); pend=[];});
    if(blk) out.daika.push(blk);}
  return out;
}

function openImport(jobId){
  IMP={jobId:jobId||'',aoa:null,hdr:0,cols:{},start:toS(nextWork(today()+7))};
  drawImport();$('dlg').showModal();
}
function drawImport(){
  const hasX=typeof XLSX!=='undefined';
  let body=`<div class="fg"><label class="f">設計書の数量表、またはATLUS NEXTの「Excel出力（印刷様式なし）」<input type="file" id="iFile" accept=".xlsx,.xls,.xlsm,.csv"></label>
    ${IMP.wb&&!IMP.atlas?`<label class="f">シート<select id="iSheet">${IMP.wb.SheetNames.map(n=>`<option${n===IMP.sheet?' selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}</div>
    ${hasX?'':'<p class="note warn">Excel読込ライブラリを読み込めていません。通信状態を確認して開き直してください。</p>'}`;
  if(IMP.aoa){
    const W=Math.min(Math.max(...IMP.aoa.slice(0,40).map(r=>r.length)),26);

    body+=`<p class="note">見出し行と列を確認してください（自動推定済み）。見出し行の次の行から、名称があり数量が数値の行を取り込みます。</p>
    <div class="fg"><label class="f">見出し行<input type="number" id="iHdr" min="1" value="${IMP.hdr+1}"></label>
    ${FIELDS.map(([k,l])=>`<label class="f">${l}の列<select data-col="${k}"><option value="-1">なし</option>${Array.from({length:W},(_,i)=>`<option value="${i}"${IMP.cols[k]===i?' selected':''}>${colName(i)}：${esc(String(IMP.aoa[IMP.hdr]?.[i]??'').slice(0,12))}</option>`).join('')}</select></label>`).join('')}</div>
    <div class="ttw"><table class="pv">${IMP.aoa.slice(Math.max(0,IMP.hdr-2),IMP.hdr+8).map((r,k)=>`<tr class="${k+Math.max(0,IMP.hdr-2)===IMP.hdr?'hd':''}"><td>${k+Math.max(0,IMP.hdr-2)+1}</td>${Array.from({length:W},(_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</table></div>`;
    const rows=impRows(); IMP.rows=rows;
    const kinds=S.bugakari.map(b=>b.kind);
    body+=`<p class="note">${rows.length}行を検出。自社工種との対応表：名称から自動で推定しています（違っていれば直す）。一度決めた対応は次回から自動で入ります。同じ自社工種に結んだ行は数量・金額を合算します。</p>
    <div class="ttw"><table class="tt" style="min-width:760px"><thead><tr><th>行</th><th>コード</th><th>名称</th><th class="num">数量</th><th class="num">金額</th><th class="num">日進量</th><th>自社工種</th></tr></thead><tbody>
    ${rows.map((r,k)=>{let cur=S.taiou[keyOf(r)]??''; if(cur===''&&IMP.atlas){cur=guessKind(r.name); if(cur) S.taiou[keyOf(r)]=cur;} return `<tr><td>${r.row}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${fmt(r.qty)}${esc(r.unit)}</td><td class="num">${r.amount?yen(r.amount):''}</td><td class="num">${r.daily?fmt(r.daily):''}</td>
      <td><select data-map="${k}" aria-label="自社工種"><option value="">未対応（官の単価・金額をそのまま使う）</option><option value="__skip"${cur==='__skip'?' selected':''}>取り込まない</option>${kinds.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('')}</select></td></tr>`}).join('')}
    </tbody></table></div>
    <div class="fg"><label class="f">取込先<select id="iJob"><option value="">新しい案件</option>${S.jobs.map(x=>`<option value="${x.id}"${x.id===IMP.jobId?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>

    <p class="note">既存案件を選ぶと、その案件の工種と未対応行を置き換えます（担当監督・班の割り当ては工種名が同じものは引き継ぎます）。</p>`;
  }
  $('dlg').innerHTML=`<form method="dialog" id="if"><div class="dh">設計書・ATLUS NEXTのExcelを取り込む</div><div class="db">${body}<p class="note warn" id="iMsg"></p></div>
    <div class="df"><button type="button" class="btn" id="iC">閉じる</button>${IMP.aoa?'<button class="btn primary">取り込む</button>':''}</div></form>`;
  const d=$('dlg');
  $('iC').onclick=()=>d.close();
  $('iFile').onchange=e=>{const f=e.target.files[0]; if(!f) return;

          IMP.sheet='（印刷様式を解析）'; IMP.aoa=[['名称','数量','単位','単価','金額','摘要'],...IMP.atlas.items.map(x=>[x.name,x.qty,x.unit,x.price??'',x.amount,x.ref||''])];
          IMP.hdr=0; IMP.cols={name:0,code:-1,qty:1,unit:2,amount:4,daily:-1,days:-1}; drawImport(); return}
        IMP.atlas=null; setSheet(IMP.wb.SheetNames[0]);}catch(err){console.error(err);$('iMsg').textContent='このファイルは読めませんでした。Excel形式か確認してください。'}};
    rd.readAsArrayBuffer(f);};
  if(IMP.wb&&!IMP.atlas) $('iSheet').onchange=e=>setSheet(e.target.value);
  if(!IMP.aoa) return;

function estTotals(j){
  const rows=estRows(j), direct=rows.reduce((a,r)=>a+r.amt,0)+(j.extra||[]).reduce((a,e)=>a+(e.est??e.amount??0),0);
  const srcK=(j.atlas?.keihi||[]); const useSrc=j.estMode==='src'&&srcK.length;
  const keihi=useSrc?0:Math.round(direct*S.est.keihi), houtei=useSrc?0:Math.round(direct*S.est.houtei);
  const srcSum=useSrc?srcK.reduce((a,k)=>a+(k.amt||0),0):0; const sub=direct+keihi+houtei+srcSum;
  const est=useSrc?Math.round(sub):Math.ceil(sub/10000)*10000, tax=Math.round(est*S.est.tax);
  const bud=budgetRows(j).reduce((a,r)=>a+(r.total||0),0);

  return {rows,direct,keihi,houtei,sub,est,tax,bud,rev,useSrc,srcK,srcSum};
}

// ---------- 配置の最適化（貪欲法） ----------
// 納期順に案件を取り、工種ごとに「禁止でない班」の中から評点最小の班と最早開始日を選ぶ。固定（lock）の工種は動かさない。
function optimize(){
  const jobs=active().slice().sort((a,b)=>(a.due?toN(a.due):1e9)-(b.due?toN(b.due):1e9)||((span(a)?.[0]??1e9)-(span(b)?.[0]??1e9)));
  const t0=today(); const W=S.weights; const STAFF=S.staff||20;
  // 監督ごとの日別現場集合と、全体の日別人数（固定分から始める）
  const busy={}; S.sups.forEach(c=>busy[c]={}); const used={};
  const occupy=(c,s,e,job,men)=>{for(let n=s;n<=e;n++){ if(isHol(n)) continue; (busy[c][n]||(busy[c][n]=new Set())).add(job.id); used[n]=(used[n]||0)+men; }};
  const free=(c,s,e,job,men)=>{for(let n=s;n<=e;n++){ if(isHol(n)) continue; const st=busy[c][n]; if(st&&!st.has(job.id)&&st.size>=S.supCap) return false; if((used[n]||0)+men>STAFF) return false;} return true};
  S.jobs.forEach(j=>j.tasks.forEach(t=>{if(t.lock&&t.crew&&t.start&&t.end)occupy(t.crew,toN(t.start),toN(t.end),j,menOf(t))}));
  const loadOf=c=>Object.keys(busy[c]).length;
  const log=[];
  jobs.forEach(j=>{
    let prevEnd=null, prevCrewEnd={};
    j.tasks.forEach(t=>{
      if(t.lock){if(t.end)prevEnd=toN(t.end);return}
      const q=parseFloat(t.qty)||0, b=bk(t.kind), st=stats(b,j.tags), men=menOf(t);
      const earliest=nextWork(Math.max(prevEnd!==null?prevEnd+1:(t.start?toN(t.start):t0), t0));
      let best=null,bs=Infinity;
      S.sups.forEach(c=>{
        const r=crewRank(c,t.kind), ru=rule(r,j.diff||'B'); if(ru.use==='禁止'&&b&&b.unit!=='日') return;
        const days=(b&&st&&st.rate>0&&q>0)?Math.max(1,Math.ceil(q/(st.rate*(b.unit==='日'?1:(ru.k||1))*menRatio(t)))):(t.start&&t.end?Math.max(1,wdays(toN(t.start),toN(t.end))):1);
        let s=earliest,k=0; while(!free(c,s,endOf(s,days),j,men)&&k++<400) s=nextWork(s+1);
        const e=endOf(s,days);
        const late=j.due?Math.max(0,e-toN(j.due)):0;
        const pe=prevCrewEnd[c]??Object.keys(busy[c]).map(Number).filter(n=>n<s).sort((a,b)=>b-a)[0];
        const other=pe!==undefined&&busy[c][pe]&&[...busy[c][pe]].some(x=>x!==j.id);
        const far=other&&s-pe<=3?({A:2,B:1,C:0}[j.dist||'B']):0;
        const waste=ru.waste?1:0;
        const sc=late*W.due+(e-earliest)/10*W.early+far*W.dist+waste*W.waste+loadOf(c)/10*W.level+(ru.use==='推奨'?0:0.5)+(c===j.sup?0:0.3);
        if(sc<bs){bs=sc;best={c,s,e,days,r,ru,late}}
      });
      if(!best){log.push(`${j.name}／${t.kind}：配置できる監督がいません（禁止ばかり）`);return}
      t.crew=best.c;t.start=toS(best.s);t.end=toS(best.e);occupy(best.c,best.s,best.e,j,men);prevCrewEnd[best.c]=best.e;prevEnd=best.e;
      if(best.late)log.push(`${j.name}／${t.kind}：納期を${best.late}日超過（${best.c}・${best.r}）`);
    });
    // 主担当＝工種を最も多く受け持つ監督
    const cnt={}; j.tasks.forEach(t=>{if(t.crew)cnt[t.crew]=(cnt[t.crew]||0)+1});

let draft=null;
function others(){return S.jobs.filter(j=>j.id!==draft.id&&(V.pros||j.status==='受注'))}
function autoAssign(){
  readForm();
  const pool=()=>others().concat([draft]);
  draft.tasks.forEach(t=>{
    if(t.crew||!t.start||!t.end) return;
    const a=toN(t.start),b=toN(t.end);
    let best=null,bv=Infinity;
    S.sups.forEach(c=>{let v=0; if(rule(crewRank(c,t.kind),draft.diff||'B').use==='禁止') return;
      pool().forEach(j=>j.tasks.forEach(u=>{ if(u!==t&&u.crew===c&&u.start&&u.end){const x=Math.max(a,toN(u.start)),y=Math.min(b,toN(u.end)); if(x<=y) v+=y-x+1}}));
      if(v<bv){bv=v;best=c}});
    t.crew=best;
  });
  const sp=span(draft);
  if(!draft.sup&&sp){
    let best=null,bv=Infinity;
    S.sups.forEach(p=>{let v=0;
      for(let n=sp[0];n<=sp[1];n++){const k=others().filter(j=>{const s=span(j);return j.sup===p&&s&&s[0]<=n&&n<=s[1]}).length; if(k>=S.supCap) v++}
      if(v<bv){bv=v;best=p}});
    draft.sup=best;
  }
  drawEdit();
}
function addTemplate(){
  readForm();
  const last=draft.tasks.filter(t=>t.end).map(t=>toN(t.end));

    draft.tasks.push({id:uid(),kind:k,qty:q,start:toS(n),end:toS(n),crew:''}); n++;});

  drawEdit();
}

      <label class="f">総人員（作業員の人数）<input id="dStaff" type="number" min="1" value="${S.staff||20}"></label>
      <label class="f">人日単価（円／人・日）<input id="dManDay" type="number" min="0" step="500" value="${S.manDay||28000}"></label>
      <label class="f">監督1人の同時担当現場数<input id="dSupCap" type="number" min="1" value="${S.supCap}"></label>
      <label class="f">休日<select id="dHol">${[['sat-sun','土日休み'],['sun','日曜のみ休み'],['none','休みなし']].map(([v,l])=>`<option value="${v}"${S.holiday===v?' selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <p class="note">体制＝監督が現場ごとに人数を決めて配置する。工程は「人数で割った日数」、原価は「人日×人日単価」、配置の制約は「総人員」と「監督の同時現場数」。人日単価は給与÷稼働日＋法定福利＋日当等の実額で（初期値28,000円は仮置き）。</p>
    <p class="note">データはこの端末のブラウザに保存されます。別の端末へ移すときは下の文字列をコピーし、移し先で貼り付けて「読み込む」を押してください。</p>
    <textarea class="code" id="dJson" aria-label="データ">${esc(JSON.stringify(S,null,1))}</textarea>
  </div>
  <div class="df">
    <button type="button" class="btn danger l" id="dReset">案件を全部消す（歩掛り・班・設定は残す）</button>
    <button type="button" class="btn" id="dImport">貼り付けた内容を読み込む</button>
    <button type="button" class="btn" id="dClose">閉じる</button>
    <button type="submit" class="btn primary">設定を保存</button>
  </div></form>`;
  const f=$('dlg'), rename=(oldL,newL,key)=>{ // 名前変更を案件側にも反映
    oldL.forEach((o,i)=>{const n=newL[i]; if(n&&n!==o) S.jobs.forEach(j=>{ if(key==='sup'){if(j.sup===o) j.sup=n} else j.tasks.forEach(t=>{if(t.crew===o) t.crew=n}) })});
  };
  f.querySelector('#dClose').onclick=()=>$('dlg').close();
  f.querySelector('#dReset').onclick=()=>{ if(confirm('案件をすべて削除します（歩掛りマスタ・班・監督・配置ルール・ATLUS対応表は残ります）。戻せません。')){S.jobs=[];save();$('dlg').close();render()} };
  f.querySelector('#dImport').onclick=()=>{ try{const x=JSON.parse(f.querySelector('#dJson').value); if(!Array.isArray(x.jobs)) throw 0; S=x; if(!S.bugakari) S.bugakari=sampleMaster(); if(!S.holiday) S.holiday='sat-sun'; migrate(); applyAll(); save(); $('dlg').close(); render()}catch(e){alert('読み込めませんでした。コピーした文字列が途中で切れていないか確認してください。')} };
  f.querySelector('#df').onsubmit=()=>{
    const sp=f.querySelector('#dSups').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean);
    rename(S.sups,sp,'sup'); rename(S.sups,sp,'crew');
    const cr={}; sp.forEach((n,i)=>{cr[n]=S.crewRank[S.sups[i]]||S.crewRank[n]||{}}); S.crewRank=cr;
    S.sups=sp; S.crews=sp; S.supCap=Math.max(1,+f.querySelector('#dSupCap').value||1); S.staff=Math.max(1,+f.querySelector('#dStaff').value||20); S.manDay=Math.max(0,+f.querySelector('#dManDay').value||28000);
    S.holiday=f.querySelector('#dHol').value; applyAll();
    save(); render();
  };
  $('dlg').showModal();
}

// ---------- 操作 ----------
const step=()=>V.zoom==='day'?28:91;
$('prev').onclick=()=>{V.start-=step();render()};
$('next').onclick=()=>{V.start+=step();render()};
$('today').onclick=()=>{V.start=monday(today())-7;render()};
$('zDay').onclick=()=>{V.zoom='day';$('zDay').setAttribute('aria-pressed','true');$('zWeek').setAttribute('aria-pressed','false');render()};
$('zWeek').onclick=()=>{V.zoom='week';$('zWeek').setAttribute('aria-pressed','true');$('zDay').setAttribute('aria-pressed','false');render()};
$('pros').onchange=e=>{V.pros=e.target.checked;render()};
$('add').onclick=()=>openEdit(null);
$('data').onclick=openData;
const TABS={design:'tDesign',mst:'tMst',est:'tEst',bud:'tBud',board:'tBoard',act:'tAct',jobs:'tJobs',rule:'tRule'};
$('gJob').onchange=e=>{V.bud=e.target.value;render()};
$('opt').onclick=()=>{if(confirm('受注・見込み案件の班・日程を納期順に組み直します（固定にチェックした工種は動かしません）。よろしいですか？'))optimize()};
Object.entries(TABS).forEach(([k,id])=>$(id).onclick=()=>{V.tab=k;Object.values(TABS).forEach(x=>$(x).setAttribute('aria-selected',String(x===id)));render()});
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-job]'); if(b) openEdit(b.dataset.job)});
render();
})();
</script>
</body>
</html>

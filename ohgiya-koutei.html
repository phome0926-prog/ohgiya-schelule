<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扇屋 見積・予算・工程ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#E9EDEB; --panel:#FFFFFF; --ink:#1F2B2E; --sub:#5E6B6D; --line:#CFD6D3; --grid:#DFE4E2;
  --weekend:#DCE3E0; --today:#2F6FB0; --bad:#C4331F; --badbg:rgba(196,51,31,.16); --focus:#2F6FB0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --board:#161C1E; --panel:#20282A; --ink:#E6ECEA; --sub:#9AA7A8; --line:#34403F; --grid:#28312F;
    --weekend:#1D2527; --today:#6FA8E0; --bad:#F06A55; --badbg:rgba(240,106,85,.2); --focus:#6FA8E0;
  }
}
:root[data-theme="dark"]{
  --board:#161C1E; --panel:#20282A; --ink:#E6ECEA; --sub:#9AA7A8; --line:#34403F; --grid:#28312F;
  --weekend:#1D2527; --today:#6FA8E0; --bad:#F06A55; --badbg:rgba(240,106,85,.2); --focus:#6FA8E0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--board);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header{padding:14px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
h1{font-size:20px;margin:0;letter-spacing:.04em}
h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:36px}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tabs{display:flex;gap:4px;padding:0 16px}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--sub)}
.tabs button[aria-selected="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}

#alerts{margin:8px 16px;padding:10px 12px;border-left:4px solid var(--bad);background:var(--panel);border-radius:0 6px 6px 0;font-size:14px}
#alerts.ok{border-color:var(--sub);color:var(--sub)}
#alerts ul{margin:4px 0 0;padding-left:1.2em}

/* board */
.wrap{margin:8px 16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 220px)}
.grid{position:relative;min-width:max-content}
.row{display:flex;border-bottom:1px solid var(--grid)}
.row.sect{background:var(--board);font-size:12px;color:var(--sub);font-weight:700}
.row.sect .lab{background:var(--board)}
.lab{position:sticky;left:0;z-index:3;width:128px;flex:0 0 128px;background:var(--panel);border-right:1px solid var(--line);padding:6px 8px;font-size:14px}
.lab .u{display:block;font-size:11px;color:var(--sub)}
.lab.bad{box-shadow:inset 4px 0 0 var(--bad)}
.track{position:relative}
.hdr{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.hdr .lab{z-index:6;font-size:12px;color:var(--sub);display:flex;align-items:flex-end}
.dcell{position:absolute;top:0;bottom:0;font-size:11px;color:var(--sub);text-align:center;border-left:1px solid var(--grid)}
.dcell.we{background:var(--weekend)}
.dcell .m{display:block;font-weight:700;color:var(--ink);white-space:nowrap;text-align:left;padding-left:2px}
.bg{position:absolute;top:0;bottom:0;pointer-events:none}
.bg.we{background:var(--weekend);opacity:.55}
.bg.today{border-left:2px solid var(--today);opacity:1;background:none;z-index:2}
.bg.bad{background:var(--badbg);border-top:2px solid var(--bad);border-bottom:2px solid var(--bad);z-index:1}
.item{position:absolute;height:24px;border-radius:4px;color:#fff;font-size:12px;line-height:24px;padding:0 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;z-index:2;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.item.pros{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);opacity:.8;outline:1px dashed rgba(0,0,0,.35);outline-offset:-1px}

/* jobs */
.jobs{margin:8px 16px 24px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.job{background:var(--panel);border:1px solid var(--line);border-left:6px solid;border-radius:6px;padding:10px 12px}
.job h3{margin:0 0 2px;font-size:16px}
.job .meta{font-size:13px;color:var(--sub)}
.job table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.job td{padding:3px 4px;border-top:1px solid var(--grid)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);margin-left:6px;vertical-align:2px}
.tag.p{border-style:dashed}
.empty{margin:24px 16px;color:var(--sub)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.db{padding:12px 16px;overflow:auto;max-height:calc(92vh - 130px)}
.df{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.df .l{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
.f input,.f select,.f textarea,.tt input,.tt select{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--panel);color:var(--ink);min-height:36px}
.ttw{overflow-x:auto;margin:12px 0 6px}
.tt{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
.tt input.q{width:90px}.tt .u,.tt .d{font-size:13px;color:var(--sub);white-space:nowrap}
.tt input[readonly]{background:var(--board);color:var(--sub)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt tfoot td{border-top:2px solid var(--line);font-weight:700}
.tt tbody td{border-top:1px solid var(--grid)}
.warn{color:var(--bad)}
.pv{font-size:12px;border-collapse:collapse}.pv td{border:1px solid var(--grid);padding:2px 4px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}.pv tr.hd td{background:var(--board);font-weight:700}
.mst.wide{max-width:none}
.mst{margin:8px 16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:820px}
.mst .tt{min-width:520px}.mst input.mr{width:110px}.mst input.mu{width:70px}
.tt th{text-align:left;font-size:12px;color:var(--sub);font-weight:400;padding:4px}
.tt td{padding:3px 4px}
.tt input[type=text]{width:100%}
.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;min-width:32px;min-height:32px}
.note{font-size:12px;color:var(--sub);margin:4px 0}
.savebar{position:sticky;top:0;z-index:5;background:#fff;padding:6px 0;border-bottom:1px solid #e5e7eb;margin-bottom:6px}
.btn.save{font-size:15px;padding:10px 18px;font-weight:700}
.btn.save.dirty{background:#b0453a;color:#fff;border-color:#b0453a;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(176,69,58,.5)}50%{box-shadow:0 0 0 8px rgba(176,69,58,0)}}
.help{margin:0 0 8px;border:1px solid #d9dee7;border-radius:8px;background:#fff;font-size:12px}.help summary{cursor:pointer;padding:6px 10px;font-weight:600;color:#1f3864;list-style:none}.help summary::before{content:'？ ';display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:#1f3864;color:#fff;font-size:11px;margin-right:4px}.help .hb{padding:0 12px 8px;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px}.help .hb b{font-weight:600;white-space:nowrap}.help .hb p{margin:0 0 6px;grid-column:1/-1;color:var(--sub)}
[title]{cursor:help}button[title]{cursor:pointer}
textarea.code{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>見積・予算・工程ボード<small>扇屋｜設計書→歩掛り→実行予算→見積→工程→配置　<span id="ver"></span></small></h1>
  <div class="bar">
    <label class="f" id="gJobWrap" style="min-width:280px">案件<select id="gJob"></select></label>
    <button class="btn primary" id="add" title="手入力で新しい案件を作る">案件を追加</button>
    <span id="boardCtl" style="display:contents">
    <button class="btn" id="prev" aria-label="前へ">◀</button>
    <button class="btn" id="today">今日</button>
    <button class="btn" id="next" aria-label="次へ">▶</button>
    <div class="seg" role="group" aria-label="表示幅">
      <button id="zDay" aria-pressed="true">8週</button><button id="zWeek" aria-pressed="false">半年</button>
    </div>
    <label class="chk"><input type="checkbox" id="pros" checked>見込み案件も含める</label>
    <button class="btn" id="opt" title="全案件の担当監督と日程を納期順に自動で決め直す（固定した工種は動かさない）">配置を最適化</button>
    <button class="btn" id="bdXls" title="人員計画表（日×監督の人数）と全案件工程表をExcelに（今週から8週）">📄 人員計画をExcelに</button>
    </span>
    <button class="btn" id="xls" title="見積書・実行予算書・工程表・人員計画表をExcelに、一覧をCSVに">Excel出力</button>
    <button class="btn" id="xEveryTop" title="進行中の全案件の1冊ずつ＋人員計画・全案件工程＋CSVを1つのzipで">📦 一式全部出力</button>
    <button class="btn" id="data" title="監督・総人員・人日単価・休日の設定と、データの書き出し／読み込み／全消去">データ・設定</button>
  </div>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="tDesign" aria-selected="true">① 設計書</button>
  <button role="tab" id="tMst" aria-selected="false">② 歩掛り</button>
  <button role="tab" id="tBud" aria-selected="false">③ 実行予算</button>
  <button role="tab" id="tEst" aria-selected="false">④ 見積</button>
  <button role="tab" id="tBoard" aria-selected="false">⑤ 計画工程</button>
  <button role="tab" id="tAct" aria-selected="false">⑥ 実施工程</button>
  <span style="flex:1"></span>
  <button role="tab" id="tJobs" aria-selected="false">案件一覧</button>
  <button role="tab" id="tRule" aria-selected="false">配置ルール</button>
</div>
<div id="alerts"></div>
<main id="main"></main>

<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<datalist id="kinds"></datalist><datalist id="vendors"></datalist><datalist id="clients"></datalist>

<script>
(function(){
const DAY=86400000, KEY='ohgiya-koutei-v3';
const COLORS=['#3F7D4E','#2F6FB0','#A0672A','#7A4E98','#1F7F86','#B0453A','#5B6B2F','#546072'];
const toN=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/DAY);
const toS=n=>new Date(n*DAY).toISOString().slice(0,10);
const today=()=>{const d=new Date();return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)};
const dow=n=>new Date(n*DAY).getUTCDay();
const md=n=>{const d=new Date(n*DAY);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const monday=n=>n-((dow(n)+6)%7);

// 歩掛り（1班1日あたりの施工量）。初期値は R5 土木工事標準積算基準書 第I編第14章②「市場単価の作業日当り標準作業量」。
// 材料単価は48期完成台帳の実勢（台帳_品目単価）、見積単価は48期出来高DBの売単価中央値（材工共・税抜）。いずれも実績で上書きしていく前提。
function sampleMaster(){
  // [工種, 単位, 1班1日あたり, 材料単価(円/単位), 見積単価(円/単位), 出所]  ※1班＝4人換算
  const R5='R7基準書 Ⅰ-14-⑤', R4='R7基準書 Ⅰ-14-④', LED='台帳', DK='出来高DB', TMP='仮置き';
  const M=[
   ['準備工','日',1,0,0,TMP],
   ['伐採工','m2',768,0,0,R4+'-76 伐木(人力・中)'],
   ['法面整形工','m2',140,0,1300,R4+'-19 切土・レキ質土'],
   ['吹付法面とりこわし工','m2',54,0,0,R4+'-20 人力'],
   ['ラス張工','m2',140,380,650,R5+'-14 表10.2'],
   ['モルタル吹付工 t=5〜7cm','m2',120,1500,4500,R5+'-13 表9.1'],['モルタル吹付工 t=8〜10cm','m2',100,2300,11000,R5+'-13 表9.1'],
   ['コンクリート吹付工 t=10cm','m2',100,2600,8280,R5+'-13 表9.2'],['コンクリート吹付工 t=15cm','m2',60,3900,0,R5+'-13 表9.2'],
   ['植生基材吹付工 t=3〜5cm','m2',140,1400,5600,R5+'-13 表9.3'],['植生基材吹付工 t=6〜8cm','m2',110,2000,6500,R5+'-13 表9.3'],['植生基材吹付工 t=10cm','m2',100,2800,0,R5+'-13 表9.3'],
   ['客土吹付工','m2',400,500,1500,R5+'-13 表9.3'],['種子散布工','m2',1100,80,150,R5+'-13 表9.3'],
   ['植生マット工','m2',200,1500,2800,R5+'-13 表9.4'],['植生シート工','m2',250,700,1290,R5+'-13 表9.4'],['張芝工','m2',300,800,1200,R5+'-13 表9.4'],
   ['繊維ネット工','m2',250,600,0,R5+'-13 表9.5'],['多機能フィルター','m2',250,1800,2350,DK+'（日当りは繊維ネット準用）'],
   ['吹付法枠工 F150','m',98,1800,0,R5+'-14 表10.1'],['吹付法枠工 F200','m',77,2500,16000,R5+'-14 表10.1'],['吹付法枠工 F300','m',51,3800,11000,R5+'-14 表10.1'],['吹付法枠工 F400','m',30,5500,10200,R5+'-14 表10.1'],['吹付法枠工 F500','m',26,7500,0,R5+'-14 表10.1'],
   ['簡易吹付法枠工','m2',19,7600,17000,'ATLUS蘇原飛鳥町 代価表（治山林道必携）10.06人工/47㎡'],
   ['鉄筋挿入工 L≦2m','本',14,7500,30000,R5+'-29 表21.1 条件Ⅰ'],['鉄筋挿入工 L=2〜5m','本',7,9000,48000,R5+'-29 表21.1 条件Ⅰ'],
   ['鉄筋挿入工 L≦2m（条件Ⅱ 狭隘）','本',8,7500,0,R5+'-29 表21.1 条件Ⅱ'],['鉄筋挿入工 L=2〜5m（条件Ⅱ 狭隘）','本',4,9000,0,R5+'-29 表21.1 条件Ⅱ'],
   ['グラウンドアンカー工','本',3,80000,220000,R4+'-36 鋼材組立〜頭部処理 3.1本/日'],
   ['落石防護網工（金網・ロープ設置）','m2',130,2500,6000,R5+'-11 表8.1 線径2.6mm'],['落石防護網 アンカー設置（岩盤用）','箇所',15,9000,0,R5+'-11 表8.2'],
   ['落石防護柵工','m',15,40000,80000,R5+'-10 表7.1 柵高2.0m'],
   ['ワイヤネット工（ロープ伏工）','m2',7,20200,41800,'扇屋49-014 代価表 58.1人/100㎡（基準書は市場単価適用外）'],
   ['DKドレーンパイプ工 L=2.0m','本',7.5,13600,65000,'扇屋49-014 代価表 0.53人/本（据付撤去8人工/回は別途）'],
   ['石積工（練積）','m2',19,15000,0,R4+'-23 積工・練石'],['コンクリートブロック積工','m2',13,12000,0,R4+'-21 間知ブロック積'],
   ['足場工','空m3',40,0,6528,R5+'-29 表21.1 仮設足場'],
   ['地盤改良工（表層）','m2',170,1500,3000,R4+'-18 安定処理(バックホウ)'],['地盤改良工（柱状）','本',20,8000,15000,TMP],
   ['擁壁工','m3',6.3,20000,60000,R4+'-24 重力式2〜5m'],['護岸工','m2',13,5000,12000,R4+'-21 間知ブロック積 準用'],
   ['外構工','日',1,30000,80000,TMP],['舗装工','m2',300,2000,4000,TMP+'（道路編 3-3 参照）'],['片付け','日',1,0,0,TMP]];
  return M.map(([kind,unit,rate,matUnit,price,src])=>({kind,unit,rate,men:stdMen(kind),mach:stdMach(kind),crewDay:120000,matUnit,price,src,actuals:[]}));
}
// 標準人数（基準書の日当り施工量が想定する編成に近い値。仮置き：扇屋の実態で直す）
function stdMen(k){
  if(/準備工|片付け/.test(k)) return 2;
  if(/法面整形|伐採|とりこわし/.test(k)) return 2;
  if(/ラス張|植生マット|植生シート|張芝|繊維ネット|多機能|種子散布|客土/.test(k)) return 3;
  if(/鉄筋挿入|グラウンドアンカー|DKドレーン/.test(k)) return 3;
  if(/石積|ブロック積|擁壁|護岸|外構/.test(k)) return 3;
  return 4; // 吹付・法枠・ワイヤネット・落石・足場・地盤改良・舗装
}
// 機械・車両の日額（仮置き）：吹付機・コンプレッサー・削孔機・トラック等
function stdMach(k){
  if(/鉄筋挿入|グラウンドアンカー|DKドレーン/.test(k)) return 30000;
  if(/吹付|法枠/.test(k)) return 15000;
  if(/地盤改良|舗装/.test(k)) return 40000;
  return 5000;
}
// 班×工種ランク（松竹梅）と現場難易度（ABC）の相性表。歩掛係数kは日進量に掛ける（0.8なら2割遅い）
function sampleRules(){
  return {
    '松':{A:{use:'推奨',k:1.0},B:{use:'可',k:1.0},C:{use:'可',k:1.0,waste:1}},
    '竹':{A:{use:'可',k:0.8},B:{use:'推奨',k:1.0},C:{use:'可',k:1.0}},
    '梅':{A:{use:'禁止',k:0.6},B:{use:'可',k:0.8},C:{use:'推奨',k:1.0}}
  };
}
const RANKS=['松','竹','梅'], GRADES=['A','B','C'];
function sample(){

  staff.cnt=staff.men; staff.over=[]; staff.lanes=1;
  {const days=Object.keys(staff.men).map(Number).sort((a,b)=>a-b); let cur=null;
   days.forEach(n=>{ if(staff.men[n]>staff.cap){ if(cur&&cur.b===n-1){cur.b=n;cur.max=Math.max(cur.max,staff.men[n])} else {cur={a:n,b:n,max:staff.men[n]};staff.over.push(cur)} } });}
  rows.unshift(staff);
  return rows;
}

function renderAlerts(rows){ $('alerts').style.display='';
  const el=$('alerts'); const list=[];
  rows.forEach(r=>{
    if(r.none && r.items.length) list.push(`<li>${esc(r.name)}：${r.items.length}件（割り当てが必要）</li>`);
    r.over.forEach(o=>list.push(r.kind==='staff'?`<li>人員不足　${md(o.a)}〜${md(o.b)}　必要${o.max}人（総人員${r.cap}人）</li>`:`<li>${esc(r.name)}　${md(o.a)}〜${md(o.b)}　同時${o.max}現場（上限${r.cap}）</li>`));
  });
  // 施工班の重複：同じ班が同じ日に別の案件へ入っている
  {const hm={}; active().forEach(j=>j.tasks.forEach(t=>{if(t.han&&t.start&&t.end)(hm[t.han]||(hm[t.han]=[])).push({j,s:toN(t.start),e:toN(t.end)})}));
   Object.entries(hm).forEach(([h,a])=>{const seen=new Set(); for(let i=0;i<a.length;i++)for(let k=i+1;k<a.length;k++){const x=a[i],y=a[k]; if(x.j.id===y.j.id) continue; const s=Math.max(x.s,y.s),e=Math.min(x.e,y.e); if(s>e) continue; const key=[x.j.id,y.j.id].sort().join('|'); if(seen.has(key)) continue; seen.add(key);
     list.push(`<li>施工班 ${esc(h)}　${md(s)}〜${md(e)}　「${esc(x.j.name)}」と「${esc(y.j.name)}」に重複</li>`)}});}
  if(!list.length){el.className='ok';el.innerHTML='人員超過・現場数超過・未割当・施工班の重複はありません。';return}
  el.className=''; el.innerHTML=`<strong>要調整 ${list.length}件</strong><ul>${list.join('')}</ul>`;
}

    if(V.zoom==='day'){

  // background stripes shared

  if(V.zoom==='day') for(let i=0;i<days;i++){const n=s0+i; if(isHol(n)) bg+=`<div class="bg we" style="left:${i*dw}px;width:${dw}px"></div>`}
  if(t>=s0&&t<=e0) bg+=`<div class="bg today" style="left:${(t-s0)*dw}px"></div>`;
  let lastKind='';
  rows.forEach(r=>{
    if(r.kind==='staff'){ // 日ごとの人数の棒

      for(let i=0;i<days;i++){const n=s0+i, m=r.men[n]||0; if(!m) continue; const hh=Math.min(40,Math.round(m/cap*32)); 
        inner+=`<div title="${md(n)}：${m}人／${cap}人" style="position:absolute;left:${i*dw+1}px;width:${Math.max(dw-2,2)}px;bottom:2px;height:${hh}px;background:${m>cap?'var(--bad,#c0392b)':'#9ab'};border-radius:2px 2px 0 0"></div>${dw>=20?`<div style="position:absolute;left:${i*dw}px;width:${dw}px;bottom:${hh+3}px;font-size:10px;text-align:center;color:${m>cap?'var(--bad,#c0392b)':'#456'}">${m}</div>`:''}`;}
      h+=`<div class="row"><div class="lab${r.over.length?' bad':''}">${esc(r.name)}<span class="u">日ごとの必要人数</span></div><div class="track" style="width:${W}px;height:${H}px">${inner}</div></div>`;
      return;}
    if(r.kind!==lastKind){lastKind=r.kind;
      h+=`<div class="row sect"><div class="lab">監督（同時${S.supCap}現場まで）</div><div class="track" style="width:${W}px;height:24px"></div></div>`;}
    const LH=28, H=r.lanes*LH+8;
    let busy=0; for(let n=s0;n<=e0;n++) if(r.cnt[n]) busy++;
    let inner=bg;
    r.over.forEach(o=>{const a=Math.max(o.a,s0),b=Math.min(o.b,e0); if(a<=b) inner+=`<div class="bg bad" style="left:${(a-s0)*dw}px;width:${(b-a+1)*dw}px"></div>`});
    r.items.forEach(it=>{
      const a=Math.max(it.s,s0),b=Math.min(it.e,e0); if(a>b) return;
      const q=it.task&&it.task.qty?`${it.task.qty}${bk(it.task.kind)?.unit||''}／`:'';
      const tip=`${it.label}\n${md(it.s)}〜${md(it.e)}（${q}稼働${wdays(it.s,it.e)}日・${it.men}人）${it.job.status==='見込み'?'\n見込み':''}`;
      inner+=`<button class="item${it.job.status==='見込み'?' pros':''}" data-job="${it.job.id}" title="${esc(tip)}"
        style="left:${(a-s0)*dw+1}px;width:${Math.max((b-a+1)*dw-2,6)}px;top:${4+it.lane*LH}px;background-color:${jc(it.job)}">${esc(it.label)}</button>`;
    });
    h+=`<div class="row"><div class="lab${r.over.length?' bad':''}">${esc(r.name)}<span class="u">${r.none?'割り当てが必要':`この範囲で${busy}/${days}日稼働`}</span></div><div class="track" style="width:${W}px;height:${H}px">${inner}</div></div>`;
  });
  h+='</div></div>';
  $('main').innerHTML=h;
}

function atlasPanel(j,rows){
  const A=j.atlas, T=A.totals;
  const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  const nin=(A.lmk['人件費']||[]).reduce((a,x)=>a+(x.unit==='人'?x.qty:0),0);
  const myMan=sum('manDays');
  const atDirect=Object.values(T).reduce((a,b)=>a+(b||0),0);
  const mach=(T['機械損料']||0)+(T['機械賃料']||0);
  const atLM=(T['人件費']||0)+mach;
  const line=(l,a,m,n='')=>`<tr><td>${l}</td><td class="num">${a==null?'—':yen(a)}</td><td class="num">${m==null?'—':yen(m)}</td><td class="num ${(m!=null&&a!=null&&m>a)?'warn':''}">${(m!=null&&a!=null)?yen(m-a):'—'}</td><td class="u">${n}</td></tr>`;
  const items=(k)=>(A.lmk[k]||[]).map(x=>`<tr><td>${esc(x.name)}<span class="u" style="display:block">${esc(x.spec||'')}</span></td><td class="num">${fmt(Math.round(x.qty*100)/100)} ${esc(x.unit)}</td><td class="num">${x.price!=null?yen(x.price):''}</td><td class="num">${yen(Math.round(x.amt))}</td></tr>`).join('');
  const dk=A.daika.map(b=>`<details><summary>${esc(b.no)}　${esc(b.name)}${b.base?`（${fmt(b.base.qty)}${esc(b.base.unit)}当り${b.unitPrice?'：'+yen(b.unitPrice)+'円/'+esc(b.base.unit):''}）`:''}</summary>
    <table class="tt"><tbody>${b.items.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${fmt(x.qty)} ${esc(x.unit)}</td><td class="num">${x.price!=null?yen(x.price):''}</td><td class="num">${yen(x.amt)}</td><td class="u">${esc(x.note||'')}</td></tr>`).join('')}</tbody></table></details>`).join('');
  return `<h3 style="margin:18px 0 4px">ATLUS NEXT の労材機集計と自社実行予算</h3>
  <p class="note">左＝ATLUSの積算（官の歩掛×単価）、右＝自社（日当り施工量×人数→人日×人日単価＋台帳の材料単価）。人工（人日）同士で比べられます。</p>
  <div class="ttw"><table class="tt" style="min-width:760px"><thead><tr><th>区分</th><th class="num">ATLUS</th><th class="num">自社実行予算</th><th class="num">自社－ATLUS</th><th>備考</th></tr></thead><tbody>
    ${line('材料費',T['材料費']||0,sum('mat'),'自社＝数量×材料単価（台帳実勢）')}
    ${line(`人件費（${fmt(Math.round(nin*100)/100)}人工）＋機械`,atLM,sum('labor')+sum('mach'),`自社＝人日${myMan}×人日単価＋機械日額。ATLUS機械＝損料${yen(T['機械損料']||0)}＋賃料${yen(T['機械賃料']||0)}`)}
    ${line('諸雑費・補正',T['諸雑費']||0,null,(A.lmk['諸雑費']||[]).map(x=>`${esc(x.name)}${x.spec?' '+esc(x.spec):''} ${yen(Math.round(x.amt))}`).join('／'))}
    ${line('直接工事費 計',atDirect,sum('total'),'自社には諸雑費・補正を含まない')}
  </tbody></table></div>
  <div class="fg" style="margin-top:8px"><div class="f">ATLUSの人工<strong style="font-size:18px">${fmt(Math.round(nin*10)/10)} 人日</strong></div>
    <div class="f">自社の人日（日数×人数）<strong style="font-size:18px">${myMan} 人日</strong></div>
    <div class="f">差<strong style="font-size:18px" class="${myMan>nin?'warn':''}">${myMan>nin?'+':''}${fmt(Math.round((myMan-nin)*10)/10)} 人日</strong></div></div>
  <details><summary>材料費の内訳（ATLUS）</summary><table class="tt"><tbody>${items('材料費')}</tbody></table></details>
  <details><summary>人件費の内訳（ATLUS）</summary><table class="tt"><tbody>${items('人件費')}</tbody></table></details>
  <details><summary>機械損料・賃料の内訳（ATLUS）</summary><table class="tt"><tbody>${items('機械損料')}${items('機械賃料')}</tbody></table></details>
  <details><summary>代価表（${A.daika.length}ブロック）</summary>${dk}</details>`;
}

// ---------- ⑥ 実施工程（計画と実績） ----------
function renderActual(){
  const j=curJob(); if(!j){$('main').innerHTML='<p class="empty">案件がありません。</p>';return}
  const rows=budgetRows(j), dzj=dezuraOf(j);
  const dates=[...j.tasks.map(t=>[t.start,t.end,t.aStart,t.aEnd]).flat()].filter(Boolean).map(toN);
  const d0=dates.length?Math.min(...dates):today(), d1=dates.length?Math.max(...dates):today()+30, span=Math.max(14,d1-d0+3);
  const pct=(a,b)=>`left:${((toN(a)-d0)/span*100).toFixed(1)}%;width:${Math.max(0.8,(toN(b)-toN(a)+1)/span*100).toFixed(1)}%`;
  const tr=rows.map((r,k)=>{const t=r.t; const pd=t.start&&t.end?wdays(toN(t.start),toN(t.end)):0; const ad=t.aStart&&t.aEnd?wdays(toN(t.aStart),toN(t.aEnd)):'';
    const rec=(r.b?.actuals||[]).find(a=>a.tid===t.id);
    return `<tr data-k="${k}"><td>${esc(t.kind)}${t.spec?`<span class="u" style="display:block;padding-left:1em">${esc(t.spec)}</span>`:''}<span class="u" style="display:block">${esc(t.crew||'班未定')}</span></td>
      <td class="num">${r.q?fmt(r.q)+esc(r.b?.unit||''):'—'}</td>
      <td class="u">${t.start?md(toN(t.start)):''}〜${t.end?md(toN(t.end)):''}<span style="display:block">${pd?pd+'日':''}</span></td>
      <td><input type="date" class="as" value="${esc(t.aStart||'')}" aria-label="実績開始"> 〜 <input type="date" class="ae" value="${esc(t.aEnd||'')}" aria-label="実績終了"></td>
      <td class="num"><input type="number" min="0.5" step="0.1" class="am" value="${esc(t.aMen??'')}" style="width:62px;text-align:right" aria-label="実績人数" placeholder="${menOf(t)}">${t.aSrc?`<span class="u" style="display:block">${esc(t.aSrc)}</span>`:''}</td>
      <td class="num"><input type="number" step="any" min="0" class="ad" value="${esc(t.aDays??ad)}" style="width:80px;text-align:right" aria-label="実績日数" placeholder="${ad}"></td>
      <td class="num"><input type="number" step="any" min="0" class="aq" value="${esc(t.aQty??'')}" style="width:90px;text-align:right" aria-label="出来高数量" placeholder="${esc(t.qty??'')}"></td>
      <td class="num ${t.aDays&&pd&&t.aDays>pd?'warn':''}">${t.aDays&&pd?((t.aDays>pd?'+':'')+(t.aDays-pd)+'日'):''}</td>
      <td>${rec?`<span class="u">記録済 ${esc(rec.date)}</span>`:(t.aDays>0&&(parseFloat(t.aQty)||parseFloat(t.qty))>0?`<button type="button" class="btn" data-rec="${k}">歩掛に反映</button>`:'')}</td>

      out.design.push({group:lead[0],name:lead.slice(1).join(' '),unit,qty:c[i],note:c.slice(i+1).map(txt).join(' ')});});}
  Object.keys(out.lmk).forEach(k=>{if(out.totals[k]==null) out.totals[k]=out.lmk[k].reduce((a,x)=>a+(x.amt||0),0)});
  // 代価表：ブロック単位（名称・基準数量・内訳）
  const dk=A('代価表'); if(dk){let blk=null,pend=[];
    dk.forEach(r=>{const t=textsOf(r); const no=t.find(x=>/\d+号\s*単価表/.test(x));
      const v=valueRow(r);
      if(no&&!v&&t.length>=2&&!blk?.open){ // ブロック見出し
        if(blk) out.daika.push(blk); blk={no,name:t.filter(x=>x!==no).join(' '),base:null,items:[],open:true}; pend=[]; return}
      if(!blk) return;
      if(blk.open&&!blk.base){const c=r.filter(v=>v!==''&&v!=null); const i=c.findIndex(isNum); if(i>=0&&txt(c[i+1])){blk.base={qty:c[i],unit:txt(c[i+1]),spec:t.filter(x=>!isNum(x)).join(' ')}; blk.open=false; return}}
      if(t.some(x=>/^合計/.test(x))){const n=r.filter(isNum).pop(); blk.total=n; return}
      if(t.some(x=>/当り$/.test(x))){const n=r.filter(isNum).pop(); blk.unitPrice=n; return}
      if(!v){const tt=t.filter(x=>!/株式会社|^\d+$|単価表$|運転単価表$/.test(x)); if(tt.length) pend.push(...tt); return}
      blk.items.push({name:(pend.length?pend:(v.lead||[])).join(' '),qty:v.qty,unit:v.unit,price:v.price,amt:v.amt,note:v.note}); pend=[];});
    if(blk) out.daika.push(blk);}

}

const POLICIES=[['due','納期を守る','納期に間に合わせることを最優先。空いている監督なら誰でも'],['cont','主担当で続ける','案件の主担当の監督にまとめる（多少遅れても）'],['level','人を平らに使う','監督ごとの忙しさを均す。遠い現場のはしごも避ける']];
const POLICY_W={due:{due:10,early:2,dist:1,level:1,cont:1},cont:{due:3,early:1,dist:1,level:0.5,cont:6},level:{due:3,early:1,dist:3,level:4,cont:1.5}};

    <div class="ttw"><table class="tt" style="min-width:420px"><thead><tr><th>監督</th><th>難易度 A（難）</th><th>難易度 B</th><th>難易度 C（易）</th><th>いま受け持っている現場</th></tr></thead><tbody>
    ${S.sups.map(p=>{const n=active().filter(j=>j.tasks.some(t=>(t.crew||j.sup)===p)).length; return `<tr><td><strong>${esc(p)}</strong></td>${GRADES.map(g=>`<td><label class="chk"><input type="checkbox" data-sd="${esc(p)}" data-g="${g}"${canDo(p,g)?' checked':''}>担当できる</label></td>`).join('')}<td class="u">${n}件</td></tr>`}).join('')}
    </tbody></table></div>
    <h3 style="margin:16px 0 4px">配置の方針（最適化のとき何を優先するか）</h3>
    <div class="fg">${POLICIES.map(([k,l,d])=>`<label class="chk" style="align-items:flex-start;max-width:320px"><input type="radio" name="pol" value="${k}"${(S.policy||'due')===k?' checked':''}><span><strong>${l}</strong><span class="u" style="display:block">${d}</span></span></label>`).join('')}</div>

  const read=()=>{
    S.supDiff=S.supDiff||{}; document.querySelectorAll('[data-sd]').forEach(c=>{(S.supDiff[c.dataset.sd]||(S.supDiff[c.dataset.sd]={}))[c.dataset.g]=c.checked});
    const pol=document.querySelector('input[name="pol"]:checked'); S.policy=pol?pol.value:'due'; S.weights=Object.assign({},POLICY_W[S.policy]);
  };

// ---------- 配置の最適化（貪欲法） ----------
// 納期順に案件を取り、工種ごとに「禁止でない班」の中から評点最小の班と最早開始日を選ぶ。固定（lock）の工種は動かさない。
function optimize(){
  const jobs=active().slice().sort((a,b)=>(a.due?toN(a.due):1e9)-(b.due?toN(b.due):1e9)||((span(a)?.[0]??1e9)-(span(b)?.[0]??1e9)));
  const t0=today(); const W=Object.assign({},POLICY_W[S.policy||'due'],S.weights&&S.policy?{}:{}); const STAFF=S.staff||20;
  // 監督ごとの日別現場集合と、全体の日別人数（固定分から始める）
  const busy={}; S.sups.forEach(c=>busy[c]={}); const used={};
  const occupy=(c,s,e,job,men)=>{for(let n=s;n<=e;n++){ if(isHol(n)) continue; (busy[c][n]||(busy[c][n]=new Set())).add(job.id); used[n]=(used[n]||0)+men; }};
  const free=(c,s,e,job,men)=>{for(let n=s;n<=e;n++){ if(isHol(n)) continue; const st=busy[c][n]; if(st&&!st.has(job.id)&&st.size>=S.supCap) return false; if((used[n]||0)+men>STAFF) return false;} return true};
  S.jobs.forEach(j=>j.tasks.forEach(t=>{if(t.lock&&t.crew&&t.start&&t.end)occupy(t.crew,toN(t.start),toN(t.end),j,menOf(t))}));
  const loadOf=c=>Object.keys(busy[c]).length;
  const log=[];
  jobs.forEach(j=>{
    let prevEnd=null, prevCrewEnd={}, prevCrew=null;
    j.tasks.forEach(t=>{
      if(t.lock){if(t.end)prevEnd=toN(t.end);if(t.crew)prevCrew=t.crew;return}
      const q=parseFloat(t.qty)||0, b=bk(t.kind), st=stats(b,j.tags), men=menOf(t);
      const planS=j.startPlan?toN(j.startPlan):null;
      const earliest=nextWork(Math.max(prevEnd!==null?prevEnd+1:(planS??(t.start?toN(t.start):t0)), t0, planS??0));
      let best=null,bs=Infinity;
      S.sups.forEach(c=>{
        if(!canDo(c,j.diff||'B')) return;
        const days=(b&&st&&st.rate>0&&q>0)?Math.max(1,Math.ceil(q/(st.rate*menRatio(t)))):(t.start&&t.end?Math.max(1,wdays(toN(t.start),toN(t.end))):1);
        let s=earliest,k=0; while(!free(c,s,endOf(s,days),j,men)&&k++<400) s=nextWork(s+1);
        const e=endOf(s,days);
        const late=j.due?Math.max(0,e-toN(j.due)):0;
        const pe=prevCrewEnd[c]??Object.keys(busy[c]).map(Number).filter(n=>n<s).sort((a,b)=>b-a)[0];
        const other=pe!==undefined&&busy[c][pe]&&[...busy[c][pe]].some(x=>x!==j.id);
        const far=other&&s-pe<=3?({A:2,B:1,C:0}[j.dist||'B']):0;
        const sc=late*W.due+(e-earliest)/10*W.early+far*W.dist+loadOf(c)/10*W.level+((c===j.sup||c===prevCrew)?0:(W.cont??1)); // 同じ案件は同じ監督で続ける方を好む
        if(sc<bs){bs=sc;best={c,s,e,days,late}}
      });
      if(!best){log.push(`${j.name}／${tl(t)}：この難易度（${j.diff||'B'}）を担当できる監督がいません`);return}
      t.crew=best.c;t.start=toS(best.s);t.end=toS(best.e);occupy(best.c,best.s,best.e,j,men);prevCrewEnd[best.c]=best.e;prevEnd=best.e;prevCrew=best.c;
      if(best.late)log.push(`${j.name}／${tl(t)}：納期を${best.late}日超過（${best.c}）`);
    });
    // 主担当＝工種を最も多く受け持つ監督
    const cnt={}; j.tasks.forEach(t=>{if(t.crew)cnt[t.crew]=(cnt[t.crew]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; if(top&&!j.supLock) j.sup=top[0];
  });
  save(); goTab('board');
  const el=$('alerts'); el.className=log.length?'':'ok';
  el.innerHTML=`<strong>配置を最適化しました</strong>（方針：${(POLICIES.find(p=>p[0]===(S.policy||'due'))||[])[1]}／総人員${STAFF}人・監督の同時${S.supCap}現場・着手予定日を守る）${log.length?`<ul>${log.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'　納期超過・配置不能はありません。'}<div class="note">元に戻すには「データ・設定」から前の文字列を読み込んでください。固定にチェックした工種は動かしていません。</div>`;
}

let draft=null;
function others(){return S.jobs.filter(j=>j.id!==draft.id&&(V.pros||j.status==='受注'))}
function autoAssign(){
  readForm();
  const pool=()=>others().concat([draft]);
  draft.tasks.forEach(t=>{
    if(t.crew||!t.start||!t.end) return;
    const a=toN(t.start),b=toN(t.end);
    let best=null,bv=Infinity;
    S.sups.forEach(c=>{let v=0; if(!canDo(c,draft.diff||'B')) return;
      pool().forEach(j=>j.tasks.forEach(u=>{ if(u!==t&&u.crew===c&&u.start&&u.end){const x=Math.max(a,toN(u.start)),y=Math.min(b,toN(u.end)); if(x<=y) v+=y-x+1}}));
      if(v<bv){bv=v;best=c}});
    t.crew=best;
  });
  const sp=span(draft);
  if(!draft.sup&&sp){
    let best=null,bv=Infinity;
    S.sups.forEach(p=>{let v=0;
      for(let n=sp[0];n<=sp[1];n++){const k=others().filter(j=>{const s=span(j);return j.sup===p&&s&&s[0]<=n&&n<=s[1]}).length; if(k>=S.supCap) v++}
      if(v<bv){bv=v;best=p}});
    draft.sup=best;
  }
  drawEdit();
}
function addTemplate(){
  readForm();
  const last=draft.tasks.filter(t=>t.end).map(t=>toN(t.end));
  let n=last.length?Math.max(...last)+1:today();
  [['準備工',3],['法面整形工',''],['ラス張工',''],['吹付法枠工 F300',''],['植生基材吹付工 t=3〜5cm',''],['片付け',3]].forEach(([k,q])=>{ if(draft.tasks.some(t=>t.kind===k)) return;
    draft.tasks.push({id:uid(),kind:k,qty:q,start:toS(n),end:toS(n),crew:''}); n++;});
  packJob(draft);
  drawEdit();
}

// シート組み立てヘルパー：rows=[[cell,...]]、cellは値か {v,s,t,f}
function mkSheet(rows,opt={}){
  const ws={}; let maxC=0;
  rows.forEach((r,ri)=>{r.forEach((c,ci)=>{ if(c===undefined||c===null) return; maxC=Math.max(maxC,ci);
    const o=(typeof c==='object'&&c!==null&&!(c instanceof Date))?c:{v:c};
    if(o.v===undefined||o.v===null||o.v==='') { if(!o.s) return; }
    const cell={v:o.v??'',t:o.t||(typeof o.v==='number'?'n':'s'),s:o.s||XS.base}; if(o.f) cell.f=o.f;
    ws[XLSX.utils.encode_cell({r:ri,c:ci})]=cell;});});
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,rows.length-1),c:maxC}});
  if(opt.cols) ws['!cols']=opt.cols.map(w=>({wch:w}));
  if(opt.merges) ws['!merges']=opt.merges.map(m=>({s:{r:m[0],c:m[1]},e:{r:m[2],c:m[3]}}));
  if(opt.rows) ws['!rows']=opt.rows;
  ws['!margins']={left:0.5,right:0.5,top:0.6,bottom:0.6,header:0.3,footer:0.3};

}

async function saveBook(wb,name){ const out=await buildBook(wb); dlBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name); }
function dlBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000); }
async function buildBook(wb){
  let out=XLSX.write(wb,{type:'array',bookType:'xlsx',cellStyles:true});
  // SheetJSは印刷設定を書かないので、xlsx（zip）を開いて pageSetup（A4・向き・幅1ページ）を差し込む
  if(typeof JSZip!=='undefined'){try{
    const zip=await JSZip.loadAsync(out);
    for(let i=0;i<wb.SheetNames.length;i++){const f=`xl/worksheets/sheet${i+1}.xml`, file=zip.file(f); if(!file) continue; let x=await file.async('string');
      const land=!!wb.Sheets[wb.SheetNames[i]]['!landscape'], sc=wb.Sheets[wb.SheetNames[i]]['!scale'];
      if(!sc){ if(!/<sheetPr/.test(x)) x=x.replace(/(<worksheet[^>]*>)/,'$1<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>'); else x=x.replace(/<sheetPr([^>]*)\/>/,'<sheetPr$1><pageSetUpPr fitToPage="1"/></sheetPr>'); }
      const ps=sc?`<pageSetup paperSize="9" scale="${sc}" orientation="${land?'landscape':'portrait'}"/>`:`<pageSetup paperSize="9" orientation="${land?'landscape':'portrait'}" fitToWidth="1" fitToHeight="0"/>`;
      if(/<\/pageMargins>|<pageMargins[^>]*\/>/.test(x)) x=x.replace(/(<pageMargins[^>]*\/>|<\/pageMargins>)/,'$1'+ps); else x=x.replace('</worksheet>',ps+'</worksheet>');
      zip.file(f,x);}
    out=await zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'});
  }catch(e){console.warn('pageSetup skipped',e)}}
  return out;
}

  say('人員計画・全案件工程…'); zip.file(`扇屋_人員計画・全案件工程_${day}.xlsx`,await buildBook(allBook(weeks)));

// ---------- 出面（でづら）：出面スプレッドシートとの連携 ----------
// S.dezura = { 'YYYY-MM': {sites:[{code,ninku,byDay:{date:men},workers:{name:w}}], workers:[...], updated} }
// 現場コード＝工事番号（j.no）。出面は現場単位なので、工種へは計画期間で按分して実績に入れる。
const DZ={PREFIX:'出面_',ROW_DAY:2,ROW_FIRST:4,COL_DAY1:1,COL_SECOND:32}; // 0始まりの列（B=1, AG=32）
function parseDezuraSheet(aoa,month){ // Code.gs の summary_ と同じ読み方
  const days=aoa[DZ.ROW_DAY-1]||[], sites={}, workers=[];
  const add=(code,day,name,w)=>{const s=sites[code]||(sites[code]={code,ninku:0,byDay:{},workers:{}}); const d=month+'-'+String(day).padStart(2,'0'); s.ninku+=w; s.byDay[d]=(s.byDay[d]||0)+w; s.workers[name]=(s.workers[name]||0)+w;};
  const parse=raw=>{const t=String(raw??'').trim(); if(!t) return null; const half=/半$/.test(t); return {code:half?t.replace(/半$/,'').trim():t,w:half?0.5:1}};
  for(let r=DZ.ROW_FIRST-1;r<aoa.length;r++){const row=aoa[r]||[]; const name=String(row[0]??'').trim(); if(!name||name==='日別人数') continue;
    let nin=0,cnt=0;
    for(let c=DZ.COL_DAY1;c<DZ.COL_DAY1+31;c++){const day=parseInt(days[c]); if(!day) continue; const p=parse(row[c]); if(!p) continue; add(p.code,day,name,p.w); nin+=p.w; cnt++;}
    String(row[DZ.COL_SECOND]??'').split(/[,、\s]+/).forEach(tok=>{const m=tok.match(/^(\d{1,2})[:：](.+)$/); if(!m) return; const p=parse(m[2]); if(!p) return; add(p.code,+m[1],name,p.w); nin+=p.w;});
    workers.push({name,days:cnt,ninku:nin});}
  return {month,sites:Object.values(sites),workers,updated:new Date().toISOString()};
}
function dezuraOf(j){ // 案件の出面（読み込み済みの全月を合算）
  const byDay={}, workers={}; let ninku=0; if(!j.no) return {ninku:0,byDay,workers,months:[]}; const months=[];
  Object.entries(S.dezura||{}).forEach(([m,d])=>{const s=(d.sites||[]).find(x=>x.code===j.no); if(!s) return; months.push(m); ninku+=s.ninku; Object.entries(s.byDay).forEach(([k,v])=>byDay[k]=(byDay[k]||0)+v); Object.entries(s.workers||{}).forEach(([k,v])=>workers[k]=(workers[k]||0)+v);});
  return {ninku,byDay,workers,months};
}
// 出面（現場×日の人数）を工種に按分して ⑥ の実績欄に入れる
function applyDezura(j){
  const dz=dezuraOf(j); const dates=Object.keys(dz.byDay).sort(); if(!dates.length) return 0;
  const acc=j.tasks.map(()=>({days:new Set(),md:0}));
  const plan=j.tasks.map(t=>t.start&&t.end?[toN(t.start),toN(t.end)]:null);
  dates.forEach(d=>{const n=toN(d), m=dz.byDay[d]; if(!m) return;
    let idx=plan.map((p,i)=>p&&n>=p[0]&&n<=p[1]?i:-1).filter(i=>i>=0);
    if(!idx.length){ // 計画期間の外：いちばん近い工種へ
      let best=-1,bd=Infinity; plan.forEach((p,i)=>{if(!p) return; const dist=n<p[0]?p[0]-n:n-p[1]; if(dist<bd){bd=dist;best=i}}); if(best<0) best=0; idx=[best];}
    const w=idx.map(i=>menOf(j.tasks[i])), tw=w.reduce((a,b)=>a+b,0)||1;
    idx.forEach((i,k)=>{acc[i].days.add(d); acc[i].md+=m*w[k]/tw;});});
  let n=0;
  j.tasks.forEach((t,i)=>{const a=acc[i]; if(!a.days.size) return; const ds=[...a.days].sort();
    t.aStart=ds[0]; t.aEnd=ds[ds.length-1]; t.aDays=ds.length; t.aMen=Math.round(a.md/ds.length*10)/10; t.aSrc='出面'; n++;});
  return n;
}
async function dezuraFetch(month){
  if(!S.dezuraUrl) throw new Error('「データ・設定」に出面スプレッドシートのURL（Apps Script）を入れてください');
  const u=S.dezuraUrl+(S.dezuraUrl.includes('?')?'&':'?')+'action=summary&month='+encodeURIComponent(month)+(S.dezuraToken?'&token='+encodeURIComponent(S.dezuraToken):'');
  const res=await fetch(u,{redirect:'follow'}); const js=await res.json(); if(!js.ok) throw new Error(js.error||'読めませんでした');
  (S.dezura=S.dezura||{})[js.month]={sites:js.sites,workers:js.workers,updated:js.updated}; save(); return js;
}
async function dezuraPushSites(){
  if(!S.dezuraUrl) throw new Error('「データ・設定」に出面スプレッドシートのURL（Apps Script）を入れてください');
  const sites=S.jobs.filter(j=>j.no&&j.status!=='完了').map(j=>({code:j.no,name:j.name,sup:j.sup||'',status:j.status}));
  const res=await fetch(S.dezuraUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'sites',token:S.dezuraToken||'',sites}),redirect:'follow'});
  const js=await res.json(); if(!js.ok) throw new Error(js.error||'送れませんでした'); return Object.assign({n:sites.length},js.result);
}

  $('dlg').innerHTML=`<form method="dialog"><div class="dh">出面を読み込む</div><div class="db">
    <p class="note">出面スプレッドシート（作業員×日のマスに現場コード＝工事番号）から、現場ごとの日別人数を読みます。読み込むと ⑥ に「出面の人工」が出て、「出面から実績を入れる」で工種の実績（開始・終了・人数・日数）に按分して入ります。</p>
    <div class="fg"><label class="f">月<input type="month" id="zMonth" value="${ym}"></label>
      <button type="button" class="btn primary" id="zFetch"${S.dezuraUrl?'':' disabled'} title="${S.dezuraUrl?'':'データ・設定にURLを入れると使えます'}">スプレッドシートから読む</button>

    <p class="note">読み込み済み：${loaded.length?loaded.map(m=>`${m}（${(S.dezura[m].sites||[]).length}現場・${Math.round((S.dezura[m].sites||[]).reduce((a,s)=>a+s.ninku,0)*10)/10}人日）`).join('、'):'なし'}</p>
    <div id="zPrev"></div><p class="note warn" id="zMsg"></p></div>

  const show=d=>{const known=new Set(S.jobs.map(x=>x.no).filter(Boolean));
    $('zPrev').innerHTML=`<div class="ttw"><table class="tt"><thead><tr><th>現場コード</th><th>案件</th><th class="num">人工（人日）</th><th class="num">稼働日</th></tr></thead><tbody>${d.sites.sort((a,b)=>b.ninku-a.ninku).map(s=>{const jb=S.jobs.find(x=>x.no===s.code);return `<tr><td>${esc(s.code)}</td><td>${jb?esc(jb.name):'<span class="u">（アプリに該当案件なし）</span>'}</td><td class="num">${fmt(s.ninku)}</td><td class="num">${Object.keys(s.byDay).length}</td></tr>`}).join('')}</tbody></table></div><p class="note">${d.month}：作業員 ${d.workers.length}人、のべ ${fmt(d.workers.reduce((a,w)=>a+w.ninku,0))}人日。</p>`;};
  $('zFetch').onclick=async()=>{$('zMsg').textContent='読み込み中…'; try{const d=await dezuraFetch($('zMonth').value); $('zMsg').textContent=''; show(d); render();}catch(e){$('zMsg').textContent='読めませんでした：'+e.message+'（URL・公開設定・合言葉を確認）'}};
  $('zFile').onchange=e=>{const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'}); const names=wb.SheetNames.filter(n=>n.startsWith(DZ.PREFIX)); if(!names.length) throw new Error('「出面_YYYY-MM」のシートがありません');
      let last=null; names.forEach(n=>{const m=n.slice(DZ.PREFIX.length); const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}); const d=parseDezuraSheet(aoa,m); (S.dezura=S.dezura||{})[m]={sites:d.sites,workers:d.workers,updated:d.updated}; last=d;});
      save(); $('zMsg').textContent=`${names.length}か月分を読みました。`; show(last); render();}catch(err){console.error(err);$('zMsg').textContent='読めませんでした：'+err.message}}; rd.readAsArrayBuffer(f);};
  $('zPush').onclick=async()=>{$('zMsg').textContent='送信中…'; try{const r=await dezuraPushSites(); $('zMsg').textContent=`現場 ${r.n}件を送りました（追加 ${r.added}・更新 ${r.updated}）。`}catch(e){$('zMsg').textContent='送れませんでした：'+e.message}};
  $('dlg').showModal();
}
